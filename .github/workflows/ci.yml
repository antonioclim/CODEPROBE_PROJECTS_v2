name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUTF8: "1"

jobs:
  validation:
    name: Validation (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: "3.10.21"
            architecture: x64
            python_machine: x86_64
            node_arch: x64
            hash_seed: "31021"
          - os: ubuntu-24.04
            python: "3.11.16"
            architecture: x64
            python_machine: x86_64
            node_arch: x64
            hash_seed: "31116"
          - os: ubuntu-24.04
            python: "3.12.14"
            architecture: x64
            python_machine: x86_64
            node_arch: x64
            hash_seed: "31214"
          - os: ubuntu-24.04
            python: "3.13.15"
            architecture: x64
            python_machine: x86_64
            node_arch: x64
            hash_seed: "31315"
          - os: ubuntu-24.04
            python: "3.14.7"
            architecture: x64
            python_machine: x86_64
            node_arch: x64
            hash_seed: "31407"
          - os: windows-2025
            python: "3.14.7"
            architecture: x64
            python_machine: AMD64
            node_arch: x64
            hash_seed: "31408"
          - os: macos-15
            python: "3.14.7"
            architecture: arm64
            python_machine: arm64
            node_arch: arm64
            hash_seed: "31409"
    env:
      PYTHONHASHSEED: ${{ matrix.hash_seed }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true
          fetch-depth: 1
          lfs: false
          persist-credentials: false
          show-progress: false
          submodules: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          architecture: ${{ matrix.architecture }}
          check-latest: false
          python-version: ${{ matrix.python }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          architecture: ${{ matrix.architecture }}
          check-latest: false
          node-version: "24.20.0"
          package-manager-cache: false

      - name: Record and verify the toolchain
        shell: bash
        env:
          EXPECTED_NODE: "24.20.0"
          EXPECTED_NODE_ARCH: ${{ matrix.node_arch }}
          EXPECTED_PYTHON: ${{ matrix.python }}
          EXPECTED_PYTHON_MACHINE: ${{ matrix.python_machine }}
        run: |
          set -euo pipefail
          python -I -S - <<'PY'
          import os
          import platform
          import zlib

          expected = os.environ["EXPECTED_PYTHON"]
          actual = platform.python_version()
          if actual != expected:
              raise SystemExit(f"expected Python {expected}, received {actual}")
          expected_machine = os.environ["EXPECTED_PYTHON_MACHINE"]
          actual_machine = platform.machine()
          if actual_machine != expected_machine:
              raise SystemExit(
                  f"expected Python machine {expected_machine}, received {actual_machine}"
              )
          print(f"Python {actual}")
          print(f"Python machine {actual_machine}")
          print(f"zlib build={zlib.ZLIB_VERSION} runtime={zlib.ZLIB_RUNTIME_VERSION}")
          PY
          node -e '
            if (process.versions.node !== process.env.EXPECTED_NODE) {
              throw new Error(`expected Node ${process.env.EXPECTED_NODE}, received ${process.versions.node}`);
            }
            if (process.arch !== process.env.EXPECTED_NODE_ARCH) {
              throw new Error(`expected Node architecture ${process.env.EXPECTED_NODE_ARCH}, received ${process.arch}`);
            }
            console.log(`Node ${process.versions.node} (${process.arch})`);
          '
          git --version

      - name: Verify checkout normalisation
        shell: bash
        run: |
          set -euo pipefail
          git add --renormalize --all
          git diff --cached --check
          git diff --cached --exit-code

      - name: Run the canonical read-only gate
        shell: bash
        run: python -I -S -B tools/check_release.py --require-node

      - name: Confirm that validation left a clean checkout
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          dirty="$(git status --porcelain=v1 --untracked-files=all)"
          if [[ -n "$dirty" ]]; then
            printf '%s\n' "$dirty"
            exit 1
          fi

  release_reproducibility:
    name: Release reproducibility
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      PYTHONHASHSEED: "314159"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true
          fetch-depth: 1
          lfs: false
          persist-credentials: false
          show-progress: false
          submodules: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          architecture: x64
          check-latest: false
          python-version: "3.14.7"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          architecture: x64
          check-latest: false
          node-version: "24.20.0"
          package-manager-cache: false

      - name: Record and verify the toolchain
        shell: bash
        env:
          EXPECTED_NODE: "24.20.0"
          EXPECTED_NODE_ARCH: x64
          EXPECTED_PYTHON: "3.14.7"
          EXPECTED_PYTHON_MACHINE: x86_64
        run: |
          set -euo pipefail
          python -I -S - <<'PY'
          import os
          import platform
          import zlib

          expected = os.environ["EXPECTED_PYTHON"]
          actual = platform.python_version()
          if actual != expected:
              raise SystemExit(f"expected Python {expected}, received {actual}")
          expected_machine = os.environ["EXPECTED_PYTHON_MACHINE"]
          actual_machine = platform.machine()
          if actual_machine != expected_machine:
              raise SystemExit(
                  f"expected Python machine {expected_machine}, received {actual_machine}"
              )
          print(f"Python {actual}")
          print(f"Python machine {actual_machine}")
          print(f"zlib build={zlib.ZLIB_VERSION} runtime={zlib.ZLIB_RUNTIME_VERSION}")
          PY
          node -e '
            if (process.versions.node !== process.env.EXPECTED_NODE) {
              throw new Error(`expected Node ${process.env.EXPECTED_NODE}, received ${process.versions.node}`);
            }
            if (process.arch !== process.env.EXPECTED_NODE_ARCH) {
              throw new Error(`expected Node architecture ${process.env.EXPECTED_NODE_ARCH}, received ${process.arch}`);
            }
            console.log(`Node ${process.versions.node} (${process.arch})`);
          '
          git --version

      - name: Verify checkout normalisation
        shell: bash
        run: |
          set -euo pipefail
          git add --renormalize --all
          git diff --cached --check
          git diff --cached --exit-code

      - name: Run the canonical read-only gate
        shell: bash
        run: python -I -S -B tools/check_release.py --require-node

      - name: Verify checkout, archive and packet reproducibility
        shell: bash
        run: python -I -S -B tools/check_release_reproducibility.py

      - name: Confirm that reproducibility checks left a clean checkout
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          dirty="$(git status --porcelain=v1 --untracked-files=all)"
          if [[ -n "$dirty" ]]; then
            printf '%s\n' "$dirty"
            exit 1
          fi

  required:
    name: Required CI
    if: ${{ always() }}
    needs:
      - validation
      - release_reproducibility
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Require every CI job
        shell: bash
        env:
          REPRODUCIBILITY_RESULT: ${{ needs.release_reproducibility.result }}
          VALIDATION_RESULT: ${{ needs.validation.result }}
        run: |
          set -euo pipefail
          test "$VALIDATION_RESULT" = "success"
          test "$REPRODUCIBILITY_RESULT" = "success"
