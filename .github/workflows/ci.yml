name: Evidence Refresh Bootstrap

on:
  pull_request:
    branches:
      - main

permissions: {}

concurrency:
  group: evidence-refresh-${{ github.event.pull_request.number }}
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUTF8: "1"

jobs:
  refresh_release_evidence:
    name: Refresh canonical release evidence
    if: >-
      github.head_ref == 'audit/codeprobe-complete-remediation-20260907' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Check out exact audit head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true
          fetch-depth: 2
          lfs: false
          persist-credentials: true
          ref: ${{ github.event.pull_request.head.sha }}
          show-progress: false
          submodules: false

      - name: Set up canonical Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          architecture: x64
          check-latest: false
          python-version: "3.14.7"

      - name: Set up canonical Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          architecture: x64
          check-latest: false
          node-version: "24.20.0"
          package-manager-cache: false

      - name: Restore the C8 canonical workflow in the candidate tree
        shell: bash
        run: |
          set -euo pipefail
          git show HEAD^:.github/workflows/ci.yml > .github/workflows/ci.yml
          test "$(git hash-object .github/workflows/ci.yml)" = "4a80fcc322be2aa81e54408eced199820d1d8fec"

      - name: Refresh release evidence through the canonical generator
        shell: bash
        run: |
          set -euo pipefail
          python -I -S -B tools/check_release.py --require-node --write-release-evidence
          python -I -S -B tools/check_release.py --require-node

      - name: Verify the refresh changed only canonical evidence and restored workflow
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git diff --name-only | LC_ALL=C sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/ci.yml' \
            'release/final-audit-report.json' \
            'release/final-audit-summary.md' \
            'release/release-manifest.json' | LC_ALL=C sort)"
          if [[ "$actual" != "$expected" ]]; then
            printf 'Unexpected changed paths:\n%s\n' "$actual"
            exit 1
          fi
          git diff --check

      - name: Commit the canonical evidence and restored workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/ci.yml \
            release/final-audit-report.json \
            release/final-audit-summary.md \
            release/release-manifest.json
          git commit -m 'chore: refresh canonical release evidence'
          git push origin HEAD:refs/heads/audit/codeprobe-complete-remediation-20260907
