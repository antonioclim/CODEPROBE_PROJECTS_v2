name: Phase 4B verified accessibility transaction

on:
  push:
    branches:
      - audit/codeprobe-hostile-remediation
    paths:
      - .github/workflows/phase4b-accessibility-transaction.yml

permissions:
  contents: write

concurrency:
  group: codeprobe-phase4b-accessibility-transaction
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUTF8: "1"
  PYTHONHASHSEED: "31412"

jobs:
  persist:
    if: ${{ github.actor == 'antonioclim' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out the exact audit branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: audit/codeprobe-hostile-remediation
          fetch-depth: 0
          persist-credentials: true
          clean: true
          lfs: false
          show-progress: false
          submodules: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          architecture: x64
          check-latest: false
          python-version: "3.14.7"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          architecture: x64
          check-latest: false
          node-version: "24.20.0"
          package-manager-cache: false

      - name: Apply the reviewed Phase 4B candidate
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_STAGING_PARENT='70587eaa36305e36b3179fd0a6e7ed4bc3b21802'
          EXPECTED_BASELINE='e60e9018f316c5a1354957e70339f9290efc4d6b'
          EXPECTED_BASELINE_TREE='60b15e153b7994d629a265f1d307f9923119ff8e'
          EXPECTED_PATCH_SHA256='f85cf12c5a51e0f012cf331c9f981ab4849e65031c48b6fb50320d50c031ca22'
          EXPECTED_TREE='1a925a3618a67bb040e0970ef4edf7b95a3a5467'

          test "$(git rev-parse HEAD^)" = "$EXPECTED_STAGING_PARENT"
          test "$(git rev-parse "$EXPECTED_BASELINE^{tree}")" = "$EXPECTED_BASELINE_TREE"
          unexpected="$(
            git diff --name-only "$EXPECTED_BASELINE" HEAD \
              | grep -Ev '^(\.github/phase4b-patch/part-[0-9][0-9]\.b64|\.github/workflows/phase4b-accessibility-transaction\.yml)$' \
              || true
          )"
          test -z "$unexpected"

          cat .github/phase4b-patch/part-*.b64 > /tmp/codeprobe-phase4b.patch.gz.b64
          printf '%s  %s\n' \
            '9a085f9d36b407dd3e9ee96baed3d8f6472d08f0fe2c651c62331bd74d2b90e9' \
            /tmp/codeprobe-phase4b.patch.gz.b64 | sha256sum --check --strict
          base64 --decode /tmp/codeprobe-phase4b.patch.gz.b64 \
            | gzip --decompress > /tmp/codeprobe-phase4b.patch
          printf '%s  %s\n' "$EXPECTED_PATCH_SHA256" /tmp/codeprobe-phase4b.patch \
            | sha256sum --check --strict

          rm -rf .github/phase4b-patch
          rm -f .github/workflows/phase4b-accessibility-transaction.yml
          git apply --binary --whitespace=nowarn /tmp/codeprobe-phase4b.patch
          git add -A
          git diff --cached --check
          test "$(git write-tree)" = "$EXPECTED_TREE"

      - name: Run complete verification before publication
        shell: bash
        run: |
          set -euo pipefail
          python -I -S -B -m unittest discover -s tests -v 2>&1 \
            | tee /tmp/codeprobe-phase4b-tests.log
          COUNT="$(sed -nE 's/^Ran ([0-9]+) tests?.*/\1/p' /tmp/codeprobe-phase4b-tests.log | tail -n 1)"
          test "$COUNT" = '317'
          python -I -S -B tools/check_dependency_boundary.py
          python -I -S -B tools/check_release.py --require-node
          CODEPROBE_REQUIRE_HTTP_NAVIGATION=1 node tools/check_browser_accessibility.js
          test "$(git write-tree)" = '1a925a3618a67bb040e0970ef4edf7b95a3a5467'

      - name: Commit, verify and push the fast-forward
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_TREE='1a925a3618a67bb040e0970ef4edf7b95a3a5467'
          find . -type d -name __pycache__ -prune -exec rm -rf '{}' +
          git add -A
          git diff --cached --check
          test "$(git write-tree)" = "$EXPECTED_TREE"
          git config user.name 'Revolvix'
          git config user.email '48681843+antonioclim@users.noreply.github.com'
          git commit -m 'Complete accessible browser interaction and Chromium gate'
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_TREE"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          python -I -S -B tools/check_release_reproducibility.py \
            --repository . \
            --commit HEAD
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          git push origin HEAD:refs/heads/audit/codeprobe-hostile-remediation
