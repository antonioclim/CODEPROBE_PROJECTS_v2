name: Phase 1 input-boundary bootstrap

on:
  push:
    branches:
      - automation/codeprobe-phase1-bootstrap-20260901

permissions: {}

concurrency:
  group: codeprobe-phase1-input-boundary-bootstrap
  cancel-in-progress: false

env:
  TARGET_BRANCH: audit/codeprobe-hostile-remediation
  TARGET_BASE_SHA: 120253a665e160d1abae9cc4ff8c429becc42ca0
  MAIN_SHA: 328a8568b2120385e5e96384ac5782e149454e76

jobs:
  validate-prospective-tree:
    name: Prospective tree · ${{ matrix.os }} · Python ${{ matrix.python }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: '3.10'
          - os: ubuntu-24.04
            python: '3.14'
          - os: windows-2025
            python: '3.14'
          - os: macos-15
            python: '3.14'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Checkout bootstrap generator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: bootstrap
          persist-credentials: false

      - name: Checkout immutable audit head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TARGET_BASE_SHA }}
          path: target
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: ''

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Apply deterministic remediation
        shell: bash
        run: python bootstrap/tools/remediate_input_boundary_bootstrap.py --root target

      - name: Reject malformed patch output
        shell: bash
        working-directory: target
        run: git diff --check

      - name: Refresh tracked evidence after all mandatory checks
        shell: bash
        working-directory: target
        run: python -I -S -B tools/check_release.py --require-node --write-release-evidence

      - name: Verify canonical read-only gate
        shell: bash
        working-directory: target
        run: python -I -S -B tools/check_release.py --require-node

  publish-audit-commit:
    name: Publish fast-forward audit commit and verify exact head
    needs: validate-prospective-tree
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      - name: Checkout bootstrap generator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: bootstrap
          persist-credentials: false

      - name: Checkout audit branch for publication
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          path: target
          persist-credentials: true

      - name: Verify immutable inputs
        shell: bash
        working-directory: target
        run: |
          test "$(git rev-parse HEAD)" = "$TARGET_BASE_SHA"
          test "$(git rev-parse origin/main)" = "$MAIN_SHA"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
          cache: ''

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Apply remediation and refresh evidence
        shell: bash
        working-directory: target
        run: |
          python ../bootstrap/tools/remediate_input_boundary_bootstrap.py --root .
          git diff --check
          python -I -S -B tools/check_release.py --require-node --write-release-evidence | tee phase1-write-gate.log
          python -I -S -B tools/check_release.py --require-node | tee phase1-read-gate.log
          rm -f phase1-write-gate.log phase1-read-gate.log
          git diff --check

      - name: Create and push fast-forward commit
        id: commit
        shell: bash
        working-directory: target
        run: |
          test -n "$(git status --porcelain)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Harden project input boundaries"
          sha="$(git rev-parse HEAD)"
          tree="$(git rev-parse HEAD^{tree})"
          test "$(git rev-parse HEAD^)" = "$TARGET_BASE_SHA"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH" --force-with-lease="refs/heads/$TARGET_BRANCH:$TARGET_BASE_SHA"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "tree=$tree" >> "$GITHUB_OUTPUT"

      - name: Dispatch canonical CI for exact audit head
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          import json, os, urllib.request
          repository = os.environ["GITHUB_REPOSITORY"]
          branch = os.environ["TARGET_BRANCH"]
          request = urllib.request.Request(
              f"https://api.github.com/repos/{repository}/actions/workflows/ci.yml/dispatches",
              data=json.dumps({"ref": branch}).encode("utf-8"),
              method="POST",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "codeprobe-phase1-bootstrap",
              },
          )
          with urllib.request.urlopen(request) as response:
              if response.status != 204:
                  raise SystemExit(f"workflow dispatch returned {response.status}")

      - name: Wait for exact-head canonical CI
        id: canonical
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          import json, os, time, urllib.parse, urllib.request
          repository = os.environ["GITHUB_REPOSITORY"]
          branch = os.environ["TARGET_BRANCH"]
          sha = os.environ["COMMIT_SHA"]
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "codeprobe-phase1-bootstrap",
          }
          selected = None
          for _ in range(240):
              query = urllib.parse.urlencode({"event": "workflow_dispatch", "branch": branch, "per_page": 30})
              request = urllib.request.Request(
                  f"https://api.github.com/repos/{repository}/actions/workflows/ci.yml/runs?{query}",
                  headers=headers,
              )
              with urllib.request.urlopen(request) as response:
                  runs = json.load(response).get("workflow_runs", [])
              candidates = [run for run in runs if run.get("head_sha") == sha]
              if candidates:
                  selected = max(candidates, key=lambda run: int(run["id"]))
                  if selected.get("status") == "completed":
                      break
              time.sleep(10)
          if not selected or selected.get("status") != "completed":
              raise SystemExit("exact-head canonical CI did not complete within the bounded wait")
          if selected.get("conclusion") != "success":
              raise SystemExit(f"exact-head canonical CI concluded {selected.get('conclusion')}")
          output = os.environ["GITHUB_OUTPUT"]
          with open(output, "a", encoding="utf-8") as handle:
              handle.write(f"run_id={selected['id']}\n")
              handle.write(f"run_number={selected['run_number']}\n")
              handle.write(f"run_url={selected['html_url']}\n")

      - name: Update the draft PR continuity ledger
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ steps.commit.outputs.sha }}
          TREE_SHA: ${{ steps.commit.outputs.tree }}
          CI_RUN_ID: ${{ steps.canonical.outputs.run_id }}
          CI_RUN_NUMBER: ${{ steps.canonical.outputs.run_number }}
          CI_RUN_URL: ${{ steps.canonical.outputs.run_url }}
        run: |
          import json, os, re, urllib.request
          repository = os.environ["GITHUB_REPOSITORY"]
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "codeprobe-phase1-bootstrap",
          }
          url = f"https://api.github.com/repos/{repository}/pulls/1"
          with urllib.request.urlopen(urllib.request.Request(url, headers=headers)) as response:
              pull = json.load(response)
          body = pull.get("body") or ""
          start = "<!-- phase1-input-boundary:start -->"
          end = "<!-- phase1-input-boundary:end -->"
          body = re.sub(re.escape(start) + r".*?" + re.escape(end), "", body, flags=re.S).rstrip()
          section = f"""

{start}
## Phase 1 redo — bounded project-input boundary

The project-folder and ZIP ingestion boundary has been rebuilt and verified on the exact audit head.

- audit head: `{os.environ['COMMIT_SHA']}`;
- Git tree: `{os.environ['TREE_SHA']}`;
- canonical CI: [run #{os.environ['CI_RUN_NUMBER']}]({os.environ['CI_RUN_URL']}) completed successfully for that exact SHA;
- folder traversal rejects symbolic links, junctions, reparse points and special files, applies ignore and size policies before opening content and verifies stable descriptor identity during bounded reads;
- ZIP intake caps the compressed container before decoding, preflights the classic central directory before constructing the member list, rejects ZIP64, multi-disk, encrypted, unsupported and non-regular entries, caps aggregate output and compression ratio and does not decompress ignored or ineligible members;
- browser, CLI and calibration project workflows share the same bounded limits and exported project reports record the active input boundary under `input_packaging.limits`;
- hostile regressions cover size-metadata forgery, invalid limits, member-count and compression-ratio rejection, skipped decompression, ZIP symlink metadata, external filesystem links, ignored-file non-reading and special files.

The pull request remains **draft and not authorised for merge, tag or release**. Remaining work is limited to the later runtime, calibration, accessibility, coverage, recovery and repository-governance phases recorded by the hostile audit.
{end}
"""
          payload = json.dumps({"body": body + section}).encode("utf-8")
          request = urllib.request.Request(url, data=payload, method="PATCH", headers={**headers, "Content-Type": "application/json"})
          with urllib.request.urlopen(request) as response:
              updated = json.load(response)
          if not updated.get("draft") or updated.get("merged"):
              raise SystemExit("PR state changed unexpectedly")

      - name: Verify remote checkpoint invariants
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          import json, os, urllib.request
          repository = os.environ["GITHUB_REPOSITORY"]
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "codeprobe-phase1-bootstrap",
          }
          def get(path):
              with urllib.request.urlopen(urllib.request.Request(f"https://api.github.com/repos/{repository}/{path}", headers=headers)) as response:
                  return json.load(response)
          audit = get("branches/audit/codeprobe-hostile-remediation")
          main = get("branches/main")
          pull = get("pulls/1")
          assert audit["commit"]["sha"] == os.environ["COMMIT_SHA"]
          assert main["commit"]["sha"] == os.environ["MAIN_SHA"]
          assert pull["head"]["sha"] == os.environ["COMMIT_SHA"]
          assert pull["draft"] is True and pull["merged"] is False and pull["state"] == "open"
