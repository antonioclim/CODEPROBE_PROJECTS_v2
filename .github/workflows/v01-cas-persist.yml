        tests/test_dependency_boundary.py 2862a6c8eb2eea63863c06e72f1a83a9501fff55
        tests/test_documentation_resources.py 68c2f443fc0ba0eb02c300524cb561ea25132bab
        tests/test_dynamic_ui_review.py e1398a0443236d2137c760069412480492125960
        tests/test_final_package_audit.py 77efb046d762e82c9d1b77eb8859c52f58acd0fd
        tests/test_project_mode.py fdfefca0e2f44cb629f9c8eb1b1ecb2d8e3eca85
        tests/test_pyodide_provenance.py 65ae7cb1c5c4b243f301393d6eb52630637446dc
        tests/test_reference_integrity.py 8cab7199fdf4b658513a9b302b35f2480d53386b
        tests/test_release_integrity.py 4dfdf7292bf52602ea06b71970c0499041088aef
        tests/test_release_reproducibility.py 60ef93637c800c4e3a54dd0724d08b32fcc06c79
        tests/test_runtime_smoke.py 28a35780a8b531a8e82324813ac2c631e5e037d7
        tests/test_worker_contract.py 8c145d070e13e125752354c9e220efa391929d3a
        tools/build_release.py fa6fface6d478975d4226567b2ff0be30818da31
        tools/check_browser_accessibility.js 421fc2a8d319db4194bae7d44e319ddced8b6d1d
        tools/check_browser_functional.js 7c6c5309c989220b068a7e46f3923455963fd6bd
        tools/check_coverage.py 9eaec95b19921b18f029d3c33fd576ab1fc3f7b2
        tools/check_dependency_boundary.py 6ce9dcd6a105356cc21fed55cfe34862cd6041a2
        tools/check_file_references.py d3ffe280673e826937a903917c4c78da73a02a39
        tools/check_input_contracts.js 247f708d5174c881d71e546e6fd388e52b36309b
        tools/check_release.py dbb77e1b2931dd32bbce03c235213a0f00c29932
        tools/check_release_reproducibility.py fa1f76b0935fff1b9eacea2e765c66f3f2c98f64
        tools/compare_releases.py c4e2f7b4632f364c3c854c60291025ed36106ff7
        tools/coverage-policy.json 1d3be23da6cfc32a7dda53feeefae5c7103e3769
    steps:
      - name: Recover exact blobs and attach one direct-child candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import base64
          import binascii
          import bz2
          import gzip
          import hashlib
          import io
          import json
          import lzma
          import os
          import pathlib
          import tarfile
          import urllib.error
          import urllib.parse
          import urllib.request
          import zipfile
          import zlib
          from datetime import datetime, timezone

          repository = os.environ['REPOSITORY']
          base_commit = os.environ['BASE_COMMIT']
          base_tree = os.environ['BASE_TREE']
          expected_tree = os.environ['EXPECTED_TREE']
          previous_transport = os.environ['PREVIOUS_TRANSPORT']
          audit_branch = os.environ['AUDIT_BRANCH']
          transport_commit = os.environ['GITHUB_SHA']
          token = os.environ['GH_TOKEN']
          carriers = [line.strip() for line in os.environ['CARRIERS'].splitlines() if line.strip()]
          targets = dict(line.split() for line in os.environ['TARGETS'].splitlines() if line.strip())
          reverse_targets = {sha: path for path, sha in targets.items()}
          if len(carriers) != 12 or len(set(carriers)) != 12:
              raise RuntimeError('carrier inventory is not exactly twelve unique objects')
          if len(targets) != 42 or len(reverse_targets) != 42:
              raise RuntimeError('target inventory is not exactly forty-two unique blobs')

          def api(method: str, path: str, body=None, query=None, *, allow_404: bool = False):
              url = 'https://api.github.com' + path
              if query:
                  url += '?' + urllib.parse.urlencode(query)
              data = None if body is None else json.dumps(body, separators=(',', ':')).encode('utf-8')
              request = urllib.request.Request(
                  url,
                  data=data,
                  method=method,
                  headers={
                      'Authorization': f'Bearer {token}',
                      'Accept': 'application/vnd.github+json',
                      'X-GitHub-Api-Version': '2022-11-28',
                      'User-Agent': 'codeprobe-r01-carrier-recovery',
                      'Content-Type': 'application/json',
                  },
              )
              try:
                  with urllib.request.urlopen(request, timeout=90) as response:
                      raw = response.read()
                  return json.loads(raw) if raw else None
              except urllib.error.HTTPError as error:
                  detail = error.read().decode(errors='replace')
                  if allow_404 and error.code == 404:
                      return None
                  raise RuntimeError(f'{method} {path}: HTTP {error.code}: {detail[:1200]}') from error

          def git_blob_sha(data: bytes) -> str:
              return hashlib.sha1(f'blob {len(data)}\0'.encode('ascii') + data).hexdigest()

          def bounded_add(queue: list[bytes], seen: set[bytes], value: bytes | None) -> None:
              if value is None or len(value) > 32_000_000 or value in seen:
                  return
              seen.add(value)
              queue.append(value)

          def variants(seed: bytes):
              queue: list[bytes] = []
              seen: set[bytes] = set()
              bounded_add(queue, seen, seed)
              index = 0
              while index < len(queue) and index < 80:
                  value = queue[index]
                  index += 1
                  yield value
                  stripped = value.strip()
                  bounded_add(queue, seen, stripped)
                  try:
                      bounded_add(queue, seen, base64.b64decode(stripped, validate=True))
                  except (binascii.Error, ValueError):
                      pass
                  try:
                      bounded_add(queue, seen, bytes.fromhex(stripped.decode('ascii')))
                  except (ValueError, UnicodeDecodeError):
                      pass
                  try:
                      decoded = json.loads(value.decode('utf-8'))
                      if isinstance(decoded, str):
                          bounded_add(queue, seen, decoded.encode('utf-8'))
                  except (ValueError, UnicodeDecodeError):
                      pass
                  for decoder in (gzip.decompress, bz2.decompress, lzma.decompress, zlib.decompress):
                      try:
                          bounded_add(queue, seen, decoder(value))
                      except Exception:
                          pass

          recovered: dict[str, bytes] = {}

          def register(data: bytes, origin: str) -> None:
              sha = git_blob_sha(data)
              path = reverse_targets.get(sha)
              if path is not None:
                  prior = recovered.get(path)
                  if prior is not None and prior != data:
                      raise RuntimeError(f'non-unique recovery for {path}')
                  recovered[path] = data
                  print(f'RECOVERED {path} {sha} via {origin}')

          def inspect_archive(data: bytes, origin: str) -> None:
              try:
                  with zipfile.ZipFile(io.BytesIO(data)) as archive:
                      for info in archive.infolist():
                          pp = pathlib.PurePosixPath(info.filename)
                          if info.is_dir():
                              continue
                          if pp.is_absolute() or '..' in pp.parts or info.file_size > 16_000_000:
                              raise RuntimeError(f'unsafe ZIP member in {origin}: {info.filename}')
                          register(archive.read(info), f'{origin}:zip:{info.filename}')
              except zipfile.BadZipFile:
                  pass
              for mode in ('r:*',):
                  try:
                      with tarfile.open(fileobj=io.BytesIO(data), mode=mode) as archive:
                          for member in archive.getmembers():
                              pp = pathlib.PurePosixPath(member.name)
                              if member.isdir():
                                  continue
                              if not member.isfile() or member.issym() or member.islnk() or pp.is_absolute() or '..' in pp.parts or member.size > 16_000_000:
                                  raise RuntimeError(f'unsafe TAR member in {origin}: {member.name}')
                              stream = archive.extractfile(member)
                              if stream is None:
                                  raise RuntimeError(f'unreadable TAR member in {origin}: {member.name}')
                              register(stream.read(), f'{origin}:tar:{member.name}')
                  except tarfile.TarError:
                      pass

          main_ref = api('GET', f'/repos/{repository}/git/ref/heads/main')
          audit_ref = api('GET', f'/repos/{repository}/git/ref/heads/{audit_branch}')
          transport = api('GET', f'/repos/{repository}/git/commits/{transport_commit}')
          if main_ref['object']['sha'] != base_commit:
              raise RuntimeError('main moved after R01 preflight')
          if audit_ref['object']['sha'] != transport_commit:
              raise RuntimeError('audit branch does not point to this recovery transport')
          if [parent['sha'] for parent in transport['parents']] != [previous_transport]:
              raise RuntimeError('recovery transport is not the direct child of the authorised temporary head')
          transport_compare = api('GET', f'/repos/{repository}/compare/{previous_transport}...{transport_commit}')
          if transport_compare['ahead_by'] != 1 or transport_compare['behind_by'] != 0:
              raise RuntimeError('recovery transport ancestry is not a one-commit extension')
          changed_transport = {item['filename'] for item in transport_compare.get('files', [])}
          if changed_transport != {'.github/workflows/v01-cas-persist.yml'}:
              raise RuntimeError(f'recovery transport changed unexpected paths: {sorted(changed_transport)}')

          raw_carriers: list[bytes] = []
          decoded_carriers: list[bytes] = []
          for carrier_sha in carriers:
              blob = api('GET', f'/repos/{repository}/git/blobs/{carrier_sha}')
              if blob.get('sha') != carrier_sha or blob.get('encoding') != 'base64':
                  raise RuntimeError(f'carrier read-back contract failed: {carrier_sha}')
              raw = base64.b64decode(blob['content'])
              raw_carriers.append(raw)
              try:
                  decoded_carriers.append(base64.b64decode(raw.strip(), validate=True))
              except (binascii.Error, ValueError):
                  decoded_carriers.append(b'')
              for number, candidate in enumerate(variants(raw)):
                  register(candidate, f'{carrier_sha}:variant:{number}')
                  inspect_archive(candidate, f'{carrier_sha}:variant:{number}')

          aggregate_seeds = [
              b''.join(raw_carriers),
              b'\n'.join(raw_carriers),
              b''.join(item for item in decoded_carriers if item),
              b'\n'.join(item for item in decoded_carriers if item),
          ]
          for aggregate_number, seed in enumerate(aggregate_seeds):
              for variant_number, candidate in enumerate(variants(seed)):
                  register(candidate, f'aggregate:{aggregate_number}:variant:{variant_number}')
                  inspect_archive(candidate, f'aggregate:{aggregate_number}:variant:{variant_number}')

          present: set[str] = set()
          absent: set[str] = set()
          for path, sha in targets.items():
              blob = api('GET', f'/repos/{repository}/git/blobs/{sha}', allow_404=True)
              if blob is None:
                  absent.add(path)
              elif blob.get('sha') == sha:
                  present.add(path)
              else:
                  raise RuntimeError(f'target blob read-back mismatch for {path}')

          unresolved = sorted(path for path in absent if path not in recovered)
          if unresolved:
              raise RuntimeError('carrier recovery could not reconstruct exact target bytes: ' + ', '.join(unresolved))

          for path in sorted(absent):
              data = recovered[path]
              expected_sha = targets[path]
              created = api(
                  'POST',
                  f'/repos/{repository}/git/blobs',
                  {'content': base64.b64encode(data).decode('ascii'), 'encoding': 'base64'},
              )
              if created['sha'] != expected_sha:
                  raise RuntimeError(f'{path}: server returned {created["sha"]}, expected {expected_sha}')
              read_back = api('GET', f'/repos/{repository}/git/blobs/{expected_sha}')
              if read_back.get('sha') != expected_sha:
                  raise RuntimeError(f'{path}: post-create blob read-back failed')

          for path, sha in targets.items():
              blob = api('GET', f'/repos/{repository}/git/blobs/{sha}', allow_404=True)
              if blob is None or blob.get('sha') != sha:
                  raise RuntimeError(f'complete target CAS inventory failed after recovery: {path}')

          tree = api(
              'POST',
              f'/repos/{repository}/git/trees',
              {
                  'base_tree': base_tree,
                  'tree': [
                      {'path': path, 'mode': '100644', 'type': 'blob', 'sha': sha}
                      for path, sha in sorted(targets.items())
                  ],
              },
          )
          if tree['sha'] != expected_tree:
              raise RuntimeError(f'candidate tree {tree["sha"]} != {expected_tree}')
          read_tree = api('GET', f'/repos/{repository}/git/trees/{expected_tree}', query={'recursive': '1'})
          remote_blobs = {entry['path']: entry['sha'] for entry in read_tree['tree'] if entry.get('type') == 'blob'}
          mismatches = {path: (remote_blobs.get(path), sha) for path, sha in targets.items() if remote_blobs.get(path) != sha}
          if mismatches:
              raise RuntimeError(f'candidate tree read-back mismatch: {mismatches}')

          stamp = datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00', 'Z')
          identity = {
              'name': 'Antonio Clim',
              'email': '48681843+antonioclim@users.noreply.github.com',
              'date': stamp,
          }
          candidate = api(
              'POST',
              f'/repos/{repository}/git/commits',
              {
                  'message': (
                      'Complete the byte-exact I14-I19 audit remediation candidate\n\n'
                      'Persist the verified 42-file cumulative candidate directly over the authorised main baseline. '
                      'This commit is submitted for candidate-specific CI and finding adjudication. It does not close '
                      'A01-F003, change APP_VERSION or alter release state.'
                  ),
                  'tree': expected_tree,
                  'parents': [base_commit],
                  'author': identity,
                  'committer': identity,
              },
          )
          candidate_sha = candidate['sha']
          if candidate['tree']['sha'] != expected_tree or [parent['sha'] for parent in candidate['parents']] != [base_commit]:
              raise RuntimeError('candidate commit structure mismatch')

          comparison = api('GET', f'/repos/{repository}/compare/{base_commit}...{candidate_sha}')
          changed = {item['filename'] for item in comparison.get('files', [])}
          if comparison['ahead_by'] != 1 or comparison['behind_by'] != 0 or changed != set(targets):
              raise RuntimeError('candidate comparison is not exactly one direct commit with forty-two paths')
          if '.github/workflows/v01-cas-persist.yml' in changed:
              raise RuntimeError('temporary recovery workflow leaked into the candidate')

          updated = api(
              'PATCH',
              f'/repos/{repository}/git/refs/heads/{audit_branch}',
              {'sha': candidate_sha, 'force': True},
          )
          if updated['object']['sha'] != candidate_sha:
              raise RuntimeError('audit branch update response mismatch')
          ref_read_back = api('GET', f'/repos/{repository}/git/ref/heads/{audit_branch}')
          commit_read_back = api('GET', f'/repos/{repository}/git/commits/{candidate_sha}')
          if ref_read_back['object']['sha'] != candidate_sha:
              raise RuntimeError('audit branch read-back mismatch')
          if commit_read_back['tree']['sha'] != expected_tree or [parent['sha'] for parent in commit_read_back['parents']] != [base_commit]:
              raise RuntimeError('candidate commit read-back mismatch')

          print(json.dumps({
              'status': 'PASS',
              'candidate_commit': candidate_sha,
              'candidate_tree': expected_tree,
              'direct_parent': base_commit,
              'replacement_paths': len(targets),
              'target_blobs_present': len(targets),
              'recovered_from_carriers': len([path for path in absent]),
              'branch_read_back': 'PASS',
              'pr_and_ci': 'PENDING_EXTERNAL_REOPEN',
          }, indent=2, sort_keys=True))
          PY
