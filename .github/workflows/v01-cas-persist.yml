name: V01 byte-exact CAS persistence

on:
  push:
    branches:
      - audit/codeprobe-i14-runtime-config-20260909
    paths:
      - .github/workflows/v01-cas-persist.yml

permissions:
  contents: write

concurrency:
  group: codeprobe-v01-cas-persistence
  cancel-in-progress: false

jobs:
  persist:
    name: Persist verified candidate objects
    if: github.actor == 'antonioclim'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      REPOSITORY: antonioclim/CODEPROBE_PROJECTS_v2
      BASE_COMMIT: d5e1aa9e86e855f05ea570de22110aefc972b400
      BASE_TREE: dbffa8876ed833ceb9da6188255f215dc2dbf4ff
      AUDIT_BRANCH: audit/codeprobe-i14-runtime-config-20260909
      ARCHIVE_URL: https://filebin.net/codeprobe-v01-20260911-7f4e7c9a2d/v01_missing_11.tar.gz
      ARCHIVE_SIZE: '534766'
      ARCHIVE_SHA256: ff097cd24473e137a7e8603266025dec4a6bce75ab3ca915fd0791001100e5b0
    steps:
      - name: Verify, persist and attach the exact V01 candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import base64
          import hashlib
          import io
          import json
          import os
          import pathlib
          import tarfile
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          from datetime import datetime, timezone

          repository = os.environ['REPOSITORY']
          base_commit = os.environ['BASE_COMMIT']
          base_tree = os.environ['BASE_TREE']
          audit_branch = os.environ['AUDIT_BRANCH']
          archive_url = os.environ['ARCHIVE_URL']
          archive_size = int(os.environ['ARCHIVE_SIZE'])
          archive_sha256 = os.environ['ARCHIVE_SHA256']
          token = os.environ['GH_TOKEN']
          transport_commit = os.environ['GITHUB_SHA']

          targets = {
              'README.md': '1d8fe4710e5cbed0e1579f813ce9fc1c5a20f1c0',
              'app/codeprobe-ui.js': '995ce9bbbe12def1ebd1db4964d5f4702af9754a',
              'app/codeprobe.css': 'ac2db0ced202df21212cbd0511e2f14b246d4999',
              'app/index.html': '833f895fd0af547d95568fdf8c66e3837e5262df',
              'app/project-ui.js': '705ed151c94a7ce57027e8897607564e02a379c6',
              'app/project.css': 'ba920a84a59771206e778e1cca3d3092b288b3b6',
              'app/project.html': 'e265181e8c7aafad1b95c19b47842aa90be04aec',
              'app/pyodide-loader.js': 'e178061c2e023e57f739c7defb629f317f080910',
              'app/resource-integrity.json': 'eb3b2bea421fc7cc853660c1b0e735fdaf2886a0',
              'app/vendor/pyodide/README.md': '4c3103ff7d565839f87a6e792163ab20513481f6',
              'docs/04-browser-security.md': '49a10c59f8e3b9b66d2435f44aa232ce55d520c0',
              'docs/05-offline-deployment.md': '2d341777fbf8735b2a0f748323599ba3e3af87ec',
              'docs/07-ui-extension-guide.md': 'c901580a43dbf0e44355f96b175af3f8f81f030a',
              'docs/09-release-integrity.md': 'af779a13347df9160c9c7ab25fce550c78abd86a',
              'docs/16-ci-and-repository-controls.md': '0d589d724899892453d10c3cefdc7560679d5fdd',
              'docs/assets/interface-preview.png': '8c27ba73c23cd7673877771dca4e763b0e754ac4',
              'docs/history/07-institutional-packaging.md': '778fc5681bf48628dbb66775d7379158d23196bd',
              'educator/08-deployment-one-page.md': 'dd0dae6a4b6a0ff7ae731f3a03de5772c639ce42',
              'tests/test_app_runtime_tools_paths.py': 'd93b33917e8ae0621aa1fdab0928bf25e8240797',
              'tests/test_coverage_policy.py': 'e433b1eb6b501cc782e97291d68c0081b3055194',
              'tests/test_dependency_boundary.py': '2862a6c8eb2eea63863c06e72f1a83a9501fff55',
              'tests/test_documentation_resources.py': '68c2f443fc0ba0eb02c300524cb561ea25132bab',
              'tests/test_dynamic_ui_review.py': 'e1398a0443236d2137c760069412480492125960',
              'tests/test_final_package_audit.py': '77efb046d762e82c9d1b77eb8859c52f58acd0fd',
              'tests/test_project_mode.py': 'fdfefca0e2f44cb629f9c8eb1b1ecb2d8e3eca85',
              'tests/test_pyodide_provenance.py': '65ae7cb1c5c4b243f301393d6eb52630637446dc',
              'tests/test_reference_integrity.py': '8cab7199fdf4b658513a9b302b35f2480d53386b',
              'tests/test_release_integrity.py': '4dfdf7292bf52602ea06b71970c0499041088aef',
              'tests/test_release_reproducibility.py': '60ef93637c800c4e3a54dd0724d08b32fcc06c79',
              'tests/test_runtime_smoke.py': '28a35780a8b531a8e82324813ac2c631e5e037d7',
              'tests/test_worker_contract.py': '8c145d070e13e125752354c9e220efa391929d3a',
              'tools/build_release.py': 'fa6fface6d478975d4226567b2ff0be30818da31',
              'tools/check_browser_accessibility.js': '421fc2a8d319db4194bae7d44e319ddced8b6d1d',
              'tools/check_browser_functional.js': '7c6c5309c989220b068a7e46f3923455963fd6bd',
              'tools/check_coverage.py': '9eaec95b19921b18f029d3c33fd576ab1fc3f7b2',
              'tools/check_dependency_boundary.py': '6ce9dcd6a105356cc21fed55cfe34862cd6041a2',
              'tools/check_file_references.py': 'd3ffe280673e826937a903917c4c78da73a02a39',
              'tools/check_input_contracts.js': '247f708d5174c881d71e546e6fd388e52b36309b',
              'tools/check_release.py': 'dbb77e1b2931dd32bbce03c235213a0f00c29932',
              'tools/check_release_reproducibility.py': 'fa1f76b0935fff1b9eacea2e765c66f3f2c98f64',
              'tools/compare_releases.py': 'c4e2f7b4632f364c3c854c60291025ed36106ff7',
              'tools/coverage-policy.json': '1d3be23da6cfc32a7dda53feeefae5c7103e3769',
          }
          missing = {
              'README.md': 57355,
              'app/codeprobe-ui.js': 90375,
              'docs/assets/interface-preview.png': 344045,
              'tests/test_dependency_boundary.py': 66021,
              'tests/test_final_package_audit.py': 45750,
              'tests/test_project_mode.py': 66193,
              'tests/test_runtime_smoke.py': 80976,
              'tools/build_release.py': 63763,
              'tools/check_browser_functional.js': 312578,
              'tools/check_dependency_boundary.py': 133561,
              'tools/check_release_reproducibility.py': 46000,
          }

          def api(method: str, path: str, body=None, query=None):
              url = 'https://api.github.com' + path
              if query:
                  url += '?' + urllib.parse.urlencode(query)
              data = None if body is None else json.dumps(body, separators=(',', ':')).encode()
              request = urllib.request.Request(
                  url,
                  data=data,
                  method=method,
                  headers={
                      'Authorization': f'Bearer {token}',
                      'Accept': 'application/vnd.github+json',
                      'X-GitHub-Api-Version': '2022-11-28',
                      'User-Agent': 'codeprobe-v01-cas-persistence',
                      'Content-Type': 'application/json',
                  },
              )
              try:
                  with urllib.request.urlopen(request, timeout=90) as response:
                      raw = response.read()
                  return json.loads(raw) if raw else None
              except urllib.error.HTTPError as error:
                  detail = error.read().decode(errors='replace')
                  raise RuntimeError(f'{method} {path}: HTTP {error.code}: {detail[:1000]}') from error

          def git_blob_sha(data: bytes) -> str:
              header = f'blob {len(data)}\0'.encode()
              return hashlib.sha1(header + data).hexdigest()

          def download() -> bytes:
              last_error = None
              for attempt in range(5):
                  request = urllib.request.Request(
                      archive_url,
                      headers={'User-Agent': 'CodeProbe-V01-byte-exact-transport/1.0'},
                  )
                  try:
                      with urllib.request.urlopen(request, timeout=180) as response:
                          data = response.read()
                      if len(data) != archive_size:
                          raise RuntimeError(f'archive size {len(data)} != {archive_size}')
                      digest = hashlib.sha256(data).hexdigest()
                      if digest != archive_sha256:
                          raise RuntimeError(f'archive SHA-256 {digest} != {archive_sha256}')
                      return data
                  except Exception as error:
                      last_error = error
                      time.sleep(5 * (attempt + 1))
              raise RuntimeError(f'archive download failed: {last_error}')

          # Remote preconditions: main is unchanged and this is the sole transport commit over the base.
          main_ref = api('GET', f'/repos/{repository}/git/ref/heads/main')
          audit_ref = api('GET', f'/repos/{repository}/git/ref/heads/{audit_branch}')
          transport = api('GET', f'/repos/{repository}/git/commits/{transport_commit}')
          if main_ref['object']['sha'] != base_commit:
              raise RuntimeError('main moved after V01 preflight')
          if audit_ref['object']['sha'] != transport_commit:
              raise RuntimeError('audit branch no longer points to the transport commit')
          if [parent['sha'] for parent in transport['parents']] != [base_commit]:
              raise RuntimeError('transport commit is not a direct child of the authorised base')
          if transport['tree']['sha'] == base_tree:
              raise RuntimeError('transport commit unexpectedly has the base tree')

          archive = download()
          extracted = {}
          with tarfile.open(fileobj=io.BytesIO(archive), mode='r:gz') as tar:
              for member in tar.getmembers():
                  path = pathlib.PurePosixPath(member.name)
                  if path.is_absolute() or '..' in path.parts or member.issym() or member.islnk():
                      raise RuntimeError(f'unsafe archive member: {member.name}')
                  if member.isdir():
                      continue
                  if not member.isfile():
                      raise RuntimeError(f'unsupported archive member: {member.name}')
                  matches = [target for target in missing if tuple(path.parts[-len(pathlib.PurePosixPath(target).parts):]) == pathlib.PurePosixPath(target).parts]
                  if len(matches) != 1:
                      raise RuntimeError(f'unexpected or ambiguous archive member: {member.name}')
                  target = matches[0]
                  if target in extracted:
                      raise RuntimeError(f'duplicate archive member for {target}')
                  stream = tar.extractfile(member)
                  if stream is None:
                      raise RuntimeError(f'cannot read archive member: {member.name}')
                  extracted[target] = stream.read()

          if set(extracted) != set(missing):
              raise RuntimeError(f'archive file set mismatch: {sorted(extracted)}')

          for path, expected_size in missing.items():
              data = extracted[path]
              if len(data) != expected_size:
                  raise RuntimeError(f'{path}: size {len(data)} != {expected_size}')
              actual_blob = git_blob_sha(data)
              if actual_blob != targets[path]:
                  raise RuntimeError(f'{path}: Git blob {actual_blob} != {targets[path]}')

          # Persist only the eleven absent exact blobs. Existing target blobs are referenced, not rewritten.
          for path in sorted(missing):
              data = extracted[path]
              response = api(
                  'POST',
                  f'/repos/{repository}/git/blobs',
                  {'content': base64.b64encode(data).decode(), 'encoding': 'base64'},
              )
              if response['sha'] != targets[path]:
                  raise RuntimeError(f'{path}: server returned non-target blob {response["sha"]}')

          tree_entries = [
              {'path': path, 'mode': '100644', 'type': 'blob', 'sha': sha}
              for path, sha in sorted(targets.items())
          ]
          candidate_tree = api(
              'POST',
              f'/repos/{repository}/git/trees',
              {'base_tree': base_tree, 'tree': tree_entries},
          )
          candidate_tree_sha = candidate_tree['sha']
          read_tree = api(
              'GET',
              f'/repos/{repository}/git/trees/{candidate_tree_sha}',
              query={'recursive': '1'},
          )
          remote_files = {
              entry['path']: entry['sha']
              for entry in read_tree['tree']
              if entry.get('type') == 'blob'
          }
          mismatches = {
              path: (remote_files.get(path), sha)
              for path, sha in targets.items()
              if remote_files.get(path) != sha
          }
          if mismatches:
              raise RuntimeError(f'candidate tree read-back mismatch: {mismatches}')

          authored_at = datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00', 'Z')
          identity = {
              'name': 'Antonio Clim',
              'email': '48681843+antonioclim@users.noreply.github.com',
              'date': authored_at,
          }
          message = (
              'Complete integrated I14-I19 audit remediation candidate\n\n'
              'Persist the byte-exact 42-file cumulative remediation candidate over the verified main baseline. '
              'This commit is intended for candidate-specific CI and audit adjudication. It does not close A01-F003, '
              'change the application version or alter release state.'
          )
          candidate = api(
              'POST',
              f'/repos/{repository}/git/commits',
              {
                  'message': message,
                  'tree': candidate_tree_sha,
                  'parents': [base_commit],
                  'author': identity,
                  'committer': identity,
              },
          )
          candidate_sha = candidate['sha']
          if candidate['tree']['sha'] != candidate_tree_sha:
              raise RuntimeError('candidate commit tree mismatch')
          if [parent['sha'] for parent in candidate['parents']] != [base_commit]:
              raise RuntimeError('candidate commit parent mismatch')

          comparison = api(
              'GET',
              f'/repos/{repository}/compare/{base_commit}...{candidate_sha}',
          )
          changed = {item['filename'] for item in comparison['files']}
          if changed != set(targets):
              raise RuntimeError(f'candidate changed-file set mismatch: {sorted(changed)}')
          if comparison['ahead_by'] != 1 or comparison['behind_by'] != 0:
              raise RuntimeError('candidate ancestry mismatch')

          # Replace only the audit ref. Force is required because the transport and candidate commits are siblings.
          updated = api(
              'PATCH',
              f'/repos/{repository}/git/refs/heads/{audit_branch}',
              {'sha': candidate_sha, 'force': True},
          )
          if updated['object']['sha'] != candidate_sha:
              raise RuntimeError('audit ref update mismatch')

          read_ref = api('GET', f'/repos/{repository}/git/ref/heads/{audit_branch}')
          read_commit = api('GET', f'/repos/{repository}/git/commits/{candidate_sha}')
          if read_ref['object']['sha'] != candidate_sha:
              raise RuntimeError('audit ref read-back mismatch')
          if read_commit['tree']['sha'] != candidate_tree_sha:
              raise RuntimeError('candidate tree read-back mismatch')
          if [parent['sha'] for parent in read_commit['parents']] != [base_commit]:
              raise RuntimeError('candidate parent read-back mismatch')

          summary_path = os.environ.get('GITHUB_STEP_SUMMARY')
          if summary_path:
              with open(summary_path, 'a', encoding='utf-8') as summary:
                  summary.write('## V01 byte-exact persistence\n\n')
                  summary.write(f'- Exact missing blobs persisted: `{len(missing)}`\n')
                  summary.write(f'- Cumulative replacement paths: `{len(targets)}`\n')
                  summary.write(f'- Candidate tree: `{candidate_tree_sha}`\n')
                  summary.write(f'- Candidate commit: `{candidate_sha}`\n')
                  summary.write(f'- Direct parent: `{base_commit}`\n')
                  summary.write('- Audit branch read-back: `PASS`\n')
                  summary.write('- Product code executed: `NO`\n')
          print(json.dumps({
              'candidate_tree': candidate_tree_sha,
              'candidate_commit': candidate_sha,
              'direct_parent': base_commit,
              'replacement_paths': len(targets),
              'persisted_missing_blobs': len(missing),
              'branch_readback': 'PASS',
          }, indent=2))
          PY