name: V01 baseline export for byte-exact recovery

on:
  push:
    branches:
      - audit/codeprobe-i14-runtime-config-20260909
    paths:
      - .github/workflows/v01-cas-persist.yml

permissions:
  contents: read

concurrency:
  group: codeprobe-v01-baseline-export
  cancel-in-progress: false

jobs:
  export:
    name: Export authorised baseline files
    if: github.actor == 'antonioclim'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the authorised baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: d5e1aa9e86e855f05ea570de22110aefc972b400
          persist-credentials: false

      - name: Verify and archive the exact baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "d5e1aa9e86e855f05ea570de22110aefc972b400"
          git diff --quiet
          git diff --cached --quiet
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner \
            -czf baseline-d5e1aa9.tar.gz \
            README.md \
            app/codeprobe-ui.js \
            docs/assets/interface-preview.png \
            tests/test_dependency_boundary.py \
            tests/test_final_package_audit.py \
            tests/test_project_mode.py \
            tests/test_runtime_smoke.py \
            tools/build_release.py \
            tools/check_browser_functional.js \
            tools/check_dependency_boundary.py \
            tools/check_release_reproducibility.py
          sha256sum baseline-d5e1aa9.tar.gz

      - name: Upload baseline archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codeprobe-v01-baseline-d5e1aa9
          path: baseline-d5e1aa9.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
