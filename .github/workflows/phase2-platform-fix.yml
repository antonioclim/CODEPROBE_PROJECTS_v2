name: Phase 2 cross-platform correction transaction

on:
  push:
    branches:
      - audit/codeprobe-hostile-remediation
    paths:
      - .github/workflows/phase2-platform-fix.yml

permissions:
  contents: write

concurrency:
  group: codeprobe-phase2-platform-fix
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONUTF8: '1'
  PYTHONHASHSEED: '31410'

jobs:
  correct:
    if: ${{ github.actor == 'antonioclim' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out the audit branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: audit/codeprobe-hostile-remediation
          fetch-depth: 0
          persist-credentials: true
          clean: true
          lfs: false
          submodules: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.7'
          architecture: x64
          check-latest: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.20.0'
          architecture: x64
          check-latest: false
          package-manager-cache: false

      - name: Apply the exact reviewed correction
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_PARENT='d29dad653845d817edcb466256ba80a877a33d4a'
          EXPECTED_TREE='60b15e153b7994d629a265f1d307f9923119ff8e'
          EXPECTED_PATCH_SHA256='e1b301fa467b106c7a3db5efe37069efa39f164d3fb08590d4e698dc9e000984'

          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          base64 --decode tools/.phase2-platform-fix.patch.gz.b64 \
            | gzip --decompress > /tmp/codeprobe-phase2-platform-fix.patch
          printf '%s  %s\n' "$EXPECTED_PATCH_SHA256" /tmp/codeprobe-phase2-platform-fix.patch \
            | sha256sum --check --strict

          rm -f \
            .github/workflows/phase2-platform-fix.yml \
            tools/.phase2-platform-fix.patch.gz.b64
          git apply --binary --whitespace=nowarn /tmp/codeprobe-phase2-platform-fix.patch
          git add -A
          git diff --cached --check
          test "$(git write-tree)" = "$EXPECTED_TREE"

      - name: Run the complete verification gate
        id: tests
        shell: bash
        run: |
          set -euo pipefail
          python -I -S -B -m unittest discover -s tests -v 2>&1 \
            | tee /tmp/codeprobe-phase2-platform-tests.log
          COUNT="$(sed -nE 's/^Ran ([0-9]+) tests?.*/\1/p' /tmp/codeprobe-phase2-platform-tests.log | tail -n 1)"
          test "$COUNT" = '311'
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          python -I -S -B tools/check_dependency_boundary.py
          python -I -S -B tools/check_release.py --require-node

      - name: Commit and push the verified fast-forward
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_TREE='60b15e153b7994d629a265f1d307f9923119ff8e'
          find . -type d -name __pycache__ -prune -exec rm -rf '{}' +
          git add -A
          git diff --cached --check
          test "$(git write-tree)" = "$EXPECTED_TREE"
          git config user.name 'Revolvix'
          git config user.email '48681843+antonioclim@users.noreply.github.com'
          git commit -m 'Fix cross-platform input and calibration paths'
          FINAL_SHA="$(git rev-parse HEAD)"
          FINAL_TREE="$(git rev-parse HEAD^{tree})"
          test "$FINAL_TREE" = "$EXPECTED_TREE"
          test -z "$(git status --porcelain)"
          python -I -S -B tools/check_release_reproducibility.py \
            --repository . \
            --commit HEAD
          test -z "$(git status --porcelain)"
          git push origin HEAD:refs/heads/audit/codeprobe-hostile-remediation
          printf 'sha=%s\n' "$FINAL_SHA" >> "$GITHUB_OUTPUT"
          printf 'tree=%s\n' "$FINAL_TREE" >> "$GITHUB_OUTPUT"
