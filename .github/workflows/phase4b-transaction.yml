name: Phase 4B accessibility transaction

on:
  push:
    branches:
      - audit/codeprobe-hostile-remediation
    paths:
      - .github/workflows/phase4b-transaction.yml
      - .github/phase4b-patch/**

permissions:
  contents: write

concurrency:
  group: codeprobe-phase4b-accessibility-transaction
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUTF8: "1"
  PYTHONHASHSEED: "31411"

jobs:
  apply_and_verify:
    if: ${{ github.actor == 'antonioclim' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out the audit branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: audit/codeprobe-hostile-remediation
          clean: true
          fetch-depth: 0
          lfs: false
          persist-credentials: true
          show-progress: false
          submodules: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          architecture: x64
          check-latest: false
          python-version: "3.14.7"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          architecture: x64
          check-latest: false
          node-version: "24.20.0"
          package-manager-cache: false

      - name: Apply the reviewed Phase 4B candidate
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_PARENT='e60e9018f316c5a1354957e70339f9290efc4d6b'
          EXPECTED_PATCH_SHA256='01a68640a7ab4c50dc5c644507af6602182d425bb6cc5836cc3cc04be3279afb'
          EXPECTED_TREE='6d8102f08f5b53c3042afc219782f86272e25275'

          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          cat .github/phase4b-patch/part-* | base64 --decode | gzip --decompress > /tmp/codeprobe-phase4b.patch
          printf '%s  %s\n' "$EXPECTED_PATCH_SHA256" /tmp/codeprobe-phase4b.patch | sha256sum --check --strict

          rm -rf .github/phase4b-patch
          rm -f .github/workflows/phase4b-transaction.yml
          git apply --binary --whitespace=nowarn /tmp/codeprobe-phase4b.patch
          git add -A
          git diff --cached --check
          test "$(git write-tree)" = "$EXPECTED_TREE"

      - name: Run the complete verification gate
        shell: bash
        env:
          CODEPROBE_BROWSER: google-chrome
          PYTHON: python
        run: |
          set -euo pipefail
          python -I -S -B -m unittest discover -s tests -v
          python -I -S -B tools/check_dependency_boundary.py
          python -I -S -B tools/check_release.py --require-node
          test "$(node -p 'typeof WebSocket')" = "function"
          google-chrome --version
          node --check tools/browser_accessibility_smoke.mjs
          node tools/browser_accessibility_smoke.mjs
          git diff --cached --check
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"

      - name: Commit and push the verified fast-forward
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_TREE='6d8102f08f5b53c3042afc219782f86272e25275'
          git config user.name 'Revolvix'
          git config user.email '48681843+antonioclim@users.noreply.github.com'
          test "$(git write-tree)" = "$EXPECTED_TREE"
          git commit -m 'Implement accessible browser interaction and smoke testing'
          test "$(git rev-parse 'HEAD^{tree}')" = "$EXPECTED_TREE"
          python -I -S -B tools/check_release_reproducibility.py --repository . --commit HEAD
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          git push origin HEAD:refs/heads/audit/codeprobe-hostile-remediation
