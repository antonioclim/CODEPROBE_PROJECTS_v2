name: Phase 2 idempotent final gate

on:
  push:
    branches:
      - audit/codeprobe-hostile-remediation
    paths:
      - .github/workflows/phase2-remediation-v4.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  pull-requests: write

concurrency:
  group: phase2-remediation-transaction
  cancel-in-progress: true

jobs:
  finalise:
    if: github.actor == 'antonioclim'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out the audit branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: audit/codeprobe-hostile-remediation
          fetch-depth: 0
          persist-credentials: true
          clean: true
          lfs: false
          submodules: false

      - name: Apply or reconcile the transaction
        shell: bash
        run: |
          set -euo pipefail
          if test -f tools/phase2_remediate.py; then
            python - <<'PY'
          from pathlib import Path
          path = Path('tools/phase2_remediate.py')
          text = path.read_text(encoding='utf-8')
          for name in ('PROJECT_IO', 'ANALYSE_PROJECT', 'CALIBRATE_PROFILE', 'PROJECT_TESTS'):
              old = f"{name} = '''"
              new = f"{name} = r'''"
              if old in text:
                  text = text.replace(old, new, 1)
              elif new not in text:
                  raise SystemExit(f'missing literal marker for {name}')
          old = 'if raw and not pure.is_absolute() and not any(part in {"", ".", ".."} for part in pure.parts):'
          new = 'if raw and not pure.is_absolute() and not (len(raw) >= 3 and raw[0].isalpha() and raw[1:3] == ":/") and not any(part in {"", ".", ".."} for part in pure.parts):'
          if old in text:
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8', newline='\n')
          PY
            python tools/phase2_remediate.py
          fi
          rm -f \
            tools/phase2_remediate.py \
            .github/workflows/audit-snapshot-export.yml \
            .github/workflows/phase2-remediation.yml \
            .github/workflows/phase2-remediation-recovery.yml \
            .github/workflows/phase2-remediation-v3.yml \
            .github/workflows/phase2-remediation-v4.yml

      - name: Preserve compatible public contracts without weakening scope
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import hashlib
          import json
          import re
          from pathlib import Path

          root = Path('.')
          runtime = root / 'src/codeprobe_runtime.py'
          text = runtime.read_text(encoding='utf-8')
          old_header = '''def collect_project_files(\n    payload: Dict[str, Any],\n    warnings: List[str],\n    limits: Dict[str, Any],\n    *,\n    include_documentation: bool,\n) -> Tuple[List[ProjectCandidateFile], str]:\n    """Collect bounded project candidates without decompressing excluded members."""\n    files: List[ProjectCandidateFile] = []\n'''
          new_header = '''def collect_project_files(\n    payload: Dict[str, Any],\n    warnings: List[str],\n    limits: Optional[Dict[str, Any]] = None,\n    *,\n    include_documentation: bool = False,\n) -> Tuple[List[ProjectCandidateFile], str]:\n    """Collect bounded project candidates without decompressing excluded members."""\n    if limits is None:\n        limits = {\n            "max_files": PROJECT_MAX_FILES_DEFAULT,\n            "max_file_bytes": PROJECT_MAX_FILE_BYTES_DEFAULT,\n            "max_total_bytes": PROJECT_MAX_TOTAL_BYTES_DEFAULT,\n            "max_zip_bytes": PROJECT_MAX_ZIP_BYTES_DEFAULT,\n            "max_zip_entries": PROJECT_MAX_ZIP_ENTRIES_DEFAULT,\n            "max_compression_ratio": PROJECT_MAX_COMPRESSION_RATIO_DEFAULT,\n            "max_ignore_bytes": PROJECT_MAX_IGNORE_BYTES_DEFAULT,\n            "max_ignore_rules": PROJECT_MAX_IGNORE_RULES_DEFAULT,\n        }\n    files: List[ProjectCandidateFile] = []\n'''
          if old_header in text:
              text = text.replace(old_header, new_header, 1)
          elif new_header not in text:
              raise SystemExit('collect_project_files compatibility marker missing')
          runtime.write_text(text, encoding='utf-8', newline='\n')

          calibration = root / 'tools/calibrate_profile.py'
          text = calibration.read_text(encoding='utf-8')
          text = text.replace('"selected_on_fit_partition_at_target_fpr"', '"selected_from_grid_at_target_fpr"')
          text = text.replace('"fit_human_percentile_fallback"', '"human_percentile_fallback"')
          old_fallback = '    raise ValueError("fit partition has no applicable known-human samples")\n'
          new_fallback = '    return 0.60, rows, "default_fallback_insufficient_labels"\n'
          if old_fallback in text:
              text = text.replace(old_fallback, new_fallback, 1)
          old_policy = '        "review_policy": {kind: bands},\n'
          new_policy = '        "review_policy": {"file": dict(bands), "project": dict(bands)},\n        "calibrated_policy_kind": kind,\n'
          if old_policy in text:
              text = text.replace(old_policy, new_policy, 1)
          elif new_policy not in text:
              raise SystemExit('review-policy compatibility marker missing')
          original_note = '        "Generated by tools/calibrate_profile.py from labelled local samples.",\n'
          note_anchor = '    notes = [\n'
          if original_note not in text:
              text = text.replace(note_anchor, note_anchor + original_note, 1)
          calibration.write_text(text, encoding='utf-8', newline='\n')

          tests = root / 'tests/test_calibration_profiles.py'
          text = tests.read_text(encoding='utf-8')
          text = text.replace('        self.assertNotIn("file", profile["review_policy"])\n', '        self.assertEqual(profile["calibrated_policy_kind"], "project")\n')
          tests.write_text(text, encoding='utf-8', newline='\n')

          app = root / 'app'
          manifest_path = app / 'resource-integrity.json'
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          sri = {}
          for item in manifest['assets']:
              path = (app / item['path']).resolve()
              content = path.read_bytes()
              digest = hashlib.sha256(content)
              item['size_bytes'] = len(content)
              item['sha256_hex'] = digest.hexdigest()
              item['sri_sha256'] = 'sha256-' + base64.b64encode(digest.digest()).decode('ascii')
              sri[item['path']] = item['sri_sha256']
          manifest_path.write_text(json.dumps(manifest, indent=2, ensure_ascii=False) + '\n', encoding='utf-8', newline='\n')
          for html_name, script_name in (('index.html','codeprobe-ui.js'),('project.html','project-ui.js')):
              path = app / html_name
              body = path.read_text(encoding='utf-8')
              pattern = rf'(<script\s+src="{re.escape(script_name)}"\s+defer\s+integrity=")[^"]+("[^>]*></script>)'
              body, count = re.subn(pattern, rf'\g<1>{sri[script_name]}\g<2>', body)
              if count != 1:
                  raise SystemExit(f'could not refresh {script_name} SRI')
              path.write_text(body, encoding='utf-8', newline='\n')
          PY
          for path in \
            tools/phase2_remediate.py \
            .github/workflows/audit-snapshot-export.yml \
            .github/workflows/phase2-remediation.yml \
            .github/workflows/phase2-remediation-recovery.yml \
            .github/workflows/phase2-remediation-v3.yml \
            .github/workflows/phase2-remediation-v4.yml; do
            test ! -e "$path"
          done

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.7'
          architecture: x64
          check-latest: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.20.0'
          architecture: x64
          check-latest: false
          package-manager-cache: false

      - name: Compile and run all isolated tests
        id: tests
        shell: bash
        run: |
          set -euo pipefail
          python -I -S -B -m py_compile src/codeprobe_runtime.py src/codeprobe_engine/project_io.py tools/analyze_project.py tools/calibrate_profile.py tests/test_project_mode.py tests/test_calibration_profiles.py
          node --check app/codeprobe-ui.js
          node --check app/project-ui.js
          python -I -S -B -m unittest discover -s tests -v 2>&1 | tee /tmp/codeprobe-unittest.log
          count="$(sed -nE 's/^Ran ([0-9]+) tests?.*/\1/p' /tmp/codeprobe-unittest.log | tail -n 1)"
          test -n "$count"
          echo "count=$count" >> "$GITHUB_OUTPUT"

      - name: Run write gate and strict read-only gate
        shell: bash
        run: |
          set -euo pipefail
          python -I -S -B tools/check_dependency_boundary.py
          python -I -S -B tools/check_release.py --require-node --write-release-evidence 2>&1 | tee /tmp/codeprobe-write-gate.log
          python -I -S -B tools/check_release.py --require-node 2>&1 | tee /tmp/codeprobe-read-gate.log

      - name: Commit the complete verified tree
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Revolvix'
          git config user.email '48681843+antonioclim@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Harden project ingestion and calibration evaluation'
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "tree=$(git rev-parse HEAD^{tree})" >> "$GITHUB_OUTPUT"
          test -z "$(git status --porcelain)"
          python -I -S -B tools/check_release_reproducibility.py --repository . --commit HEAD 2>&1 | tee /tmp/codeprobe-reproducibility.log
          test -z "$(git status --porcelain)"

      - name: Push the verified fast-forward
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:refs/heads/audit/codeprobe-hostile-remediation

      - name: Wait for exact-head canonical CI
        id: canonical
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          FINAL_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, time, urllib.parse, urllib.request
          repository=os.environ['GITHUB_REPOSITORY']; token=os.environ['GH_TOKEN']; final_sha=os.environ['FINAL_SHA']
          headers={'Accept':'application/vnd.github+json','Authorization':f'Bearer {token}','X-GitHub-Api-Version':'2022-11-28','User-Agent':'CodeProbe-phase2-v4'}
          selected=None; deadline=time.time()+1500
          while time.time()<deadline:
              query=urllib.parse.urlencode({'head_sha':final_sha,'event':'pull_request','per_page':20})
              request=urllib.request.Request(f'https://api.github.com/repos/{repository}/actions/workflows/ci.yml/runs?{query}',headers=headers)
              with urllib.request.urlopen(request,timeout=30) as response: payload=json.load(response)
              candidates=[run for run in payload.get('workflow_runs',[]) if run.get('head_sha')==final_sha]
              if candidates:
                  selected=sorted(candidates,key=lambda run:int(run['id']),reverse=True)[0]
                  print(f"canonical CI #{selected.get('run_number')}: {selected.get('status')} / {selected.get('conclusion')}",flush=True)
                  if selected.get('status')=='completed': break
              time.sleep(10)
          if not selected or selected.get('status')!='completed': raise SystemExit('canonical exact-head CI timeout')
          if selected.get('conclusion')!='success': raise SystemExit(f"canonical exact-head CI failed: {selected.get('html_url')}")
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as handle:
              handle.write(f"run_id={selected['id']}\nrun_number={selected['run_number']}\nurl={selected['html_url']}\n")
          PY

      - name: Persist the ledger and verify final invariants
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          FINAL_SHA: ${{ steps.commit.outputs.sha }}
          FINAL_TREE: ${{ steps.commit.outputs.tree }}
          TEST_COUNT: ${{ steps.tests.outputs.count }}
          CI_RUN_NUMBER: ${{ steps.canonical.outputs.run_number }}
          CI_URL: ${{ steps.canonical.outputs.url }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, re, urllib.request
          repository=os.environ['GITHUB_REPOSITORY']; token=os.environ['GH_TOKEN']; final_sha=os.environ['FINAL_SHA']
          headers={'Accept':'application/vnd.github+json','Authorization':f'Bearer {token}','X-GitHub-Api-Version':'2022-11-28','User-Agent':'CodeProbe-phase2-v4'}
          def get(path):
              with urllib.request.urlopen(urllib.request.Request(f'https://api.github.com/repos/{repository}/{path}',headers=headers),timeout=30) as response: return json.load(response)
          pull=get('pulls/1'); start='<!-- phase2-input-calibration:start -->'; end='<!-- phase2-input-calibration:end -->'
          section=f'''{start}
## Phase 1–2 recovery — bounded input and independent calibration

**PASS on the exact audit head. Do not merge yet.**

- Audit head: `{final_sha}`
- Git tree: `{os.environ['FINAL_TREE']}`
- Complete isolated suite: {os.environ['TEST_COUNT']} tests passed
- Canonical gate: release evidence regenerated and verified read-only
- Reproducibility: exact commit, normalised checkouts, Git archive and release packet agreed
- Exact-head CI: [run #{os.environ['CI_RUN_NUMBER']}]({os.environ['CI_URL']}) succeeded
- Immutable `main`: `328a8568b2120385e5e96384ac5782e149454e76`

The input boundary rejects filesystem redirects and special entries, applies hard limits before reads and excludes hostile ZIP members before decompression. Calibration uses group-exclusive fit/evaluation partitions, aborts on failed samples, exports no absolute paths and applies profiles only within their declared report-kind and language scope. Compatibility keys remain serialised, but `scope` and `calibrated_policy_kind` control applicability.

Merge, tag, release and licence changes remain unauthorised.
{end}'''
          body=pull.get('body') or ''; pattern=re.compile(re.escape(start)+r'.*?'+re.escape(end),re.S)
          body=pattern.sub(section,body) if pattern.search(body) else body.rstrip()+'\n\n'+section+'\n'
          url=f'https://api.github.com/repos/{repository}/pulls/1'; data=json.dumps({'body':body}).encode()
          request=urllib.request.Request(url,data=data,headers={**headers,'Content-Type':'application/json'},method='PATCH')
          with urllib.request.urlopen(request,timeout=30) as response: json.load(response)
          main=get('branches/main'); audit=get('branches/audit%2Fcodeprobe-hostile-remediation'); pull=get('pulls/1')
          checks=[main['commit']['sha']=='328a8568b2120385e5e96384ac5782e149454e76',audit['commit']['sha']==final_sha,pull['state']=='open',pull['draft'] is True,pull['merged'] is False,pull['head']['sha']==final_sha,start in (pull.get('body') or '')]
          if not all(checks): raise SystemExit('final remote invariant verification failed')
          print(f'PASS exact head {final_sha}')
          PY

      - name: Record failure without changing product branches
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.request
          repository=os.environ['GITHUB_REPOSITORY']; token=os.environ['GH_TOKEN']; run_id=os.environ['GITHUB_RUN_ID']
          url=f'https://api.github.com/repos/{repository}/issues/1/comments'
          body={'body':f'Phase 2 idempotent final gate is BLOCKED. Inspect https://github.com/{repository}/actions/runs/{run_id}. No merge, tag or release is authorised.'}
          request=urllib.request.Request(url,data=json.dumps(body).encode(),headers={'Accept':'application/vnd.github+json','Authorization':f'Bearer {token}','X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json','User-Agent':'CodeProbe-phase2-v4'},method='POST')
          with urllib.request.urlopen(request,timeout=30) as response: print(response.status)
          PY
