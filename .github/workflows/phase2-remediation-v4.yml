name: Phase 2 verified persistence transaction

on:
  push:
    branches:
      - audit/codeprobe-hostile-remediation
    paths:
      - .github/workflows/phase2-remediation-v4.yml

permissions:
  contents: write

concurrency:
  group: codeprobe-phase2-verified-persistence
  cancel-in-progress: true

jobs:
  persist:
    if: ${{ github.actor == 'antonioclim' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out the audit branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: audit/codeprobe-hostile-remediation
          fetch-depth: 0
          persist-credentials: true
          clean: true
          lfs: false
          submodules: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.7'
          architecture: x64
          check-latest: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.20.0'
          architecture: x64
          check-latest: false
          package-manager-cache: false

      - name: Reconstruct the exact verified candidate tree
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_PARENT='e008efdc9f33b5bb485103d39d8959a129cd8fac'
          EXPECTED_TREE='b15da2fe62c04956f191974b0bf920b7fc044799'
          EXPECTED_DELTA_SHA256='92ca521517e0174e3f8ff9aba176d79b109d509ba76811f19f5719b6f9f6ad5f'

          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          test -f tools/phase2_remediate.py

          python - <<'PY_FIX_GENERATOR'
          from pathlib import Path
          path = Path('tools/phase2_remediate.py')
          text = path.read_text(encoding='utf-8')
          triple = "'" * 3
          for name in ('PROJECT_IO', 'ANALYSE_PROJECT', 'CALIBRATE_PROFILE', 'PROJECT_TESTS'):
              old = f"{name} = {triple}"
              new = f"{name} = r{triple}"
              if old in text:
                  text = text.replace(old, new, 1)
              elif new not in text:
                  raise SystemExit(f'missing literal marker for {name}')
          old = 'if raw and not pure.is_absolute() and not any(part in {"", ".", ".."} for part in pure.parts):'
          new = 'if raw and not pure.is_absolute() and not (len(raw) >= 3 and raw[0].isalpha() and raw[1:3] == ":/") and not any(part in {"", ".", ".."} for part in pure.parts):'
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('path-safety marker missing')
          path.write_text(text, encoding='utf-8', newline='\n')
          PY_FIX_GENERATOR

          python tools/phase2_remediate.py
          rm -f \
            tools/phase2_remediate.py \
            .github/workflows/audit-snapshot-export.yml \
            .github/workflows/phase2-remediation.yml \
            .github/workflows/phase2-remediation-recovery.yml \
            .github/workflows/phase2-remediation-v3.yml \
            .github/workflows/phase2-remediation-v4.yml

          cat tools/.phase2-persistence/part-*.txt > /tmp/codeprobe-phase2-delta.patch.gz.b64
          rm -rf tools/.phase2-persistence
          base64 --decode /tmp/codeprobe-phase2-delta.patch.gz.b64 \
            | gzip --decompress > /tmp/codeprobe-phase2-delta.patch
          printf '%s  %s\n' "$EXPECTED_DELTA_SHA256" /tmp/codeprobe-phase2-delta.patch \
            | sha256sum --check --strict
          git apply --binary --whitespace=nowarn /tmp/codeprobe-phase2-delta.patch

          for path in \
            tools/phase2_remediate.py \
            tools/.phase2-persistence \
            .github/workflows/audit-snapshot-export.yml \
            .github/workflows/phase2-remediation.yml \
            .github/workflows/phase2-remediation-recovery.yml \
            .github/workflows/phase2-remediation-v3.yml \
            .github/workflows/phase2-remediation-v4.yml; do
            test ! -e "$path"
          done

          git add -A
          git diff --cached --check
          ACTUAL_TREE="$(git write-tree)"
          printf 'candidate tree: %s\n' "$ACTUAL_TREE"
          test "$ACTUAL_TREE" = "$EXPECTED_TREE"

      - name: Run the complete local verification gate
        id: tests
        shell: bash
        run: |
          set -euo pipefail
          python -I -S -B -m py_compile \
            src/codeprobe_runtime.py \
            src/codeprobe_engine/project_io.py \
            tools/analyze_project.py \
            tools/calibrate_corpus.py \
            tools/calibrate_profile.py \
            tests/test_project_mode.py \
            tests/test_calibration_profiles.py \
            tests/test_dynamic_ui_review.py
          node --check app/codeprobe-ui.js
          node --check app/project-ui.js
          python -I -S -B -m unittest discover -s tests -v 2>&1 \
            | tee /tmp/codeprobe-phase2-tests.log
          COUNT="$(sed -nE 's/^Ran ([0-9]+) tests?.*/\1/p' /tmp/codeprobe-phase2-tests.log | tail -n 1)"
          test "$COUNT" = '310'
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          python -I -S -B tools/check_dependency_boundary.py
          python -I -S -B tools/check_release.py --require-node

      - name: Commit and push the verified fast-forward
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_TREE='b15da2fe62c04956f191974b0bf920b7fc044799'
          git config user.name 'Revolvix'
          git config user.email '48681843+antonioclim@users.noreply.github.com'
          find . -type d -name __pycache__ -prune -exec rm -rf '{}' +
          git commit -m 'Harden project ingestion and calibration evaluation'
          FINAL_SHA="$(git rev-parse HEAD)"
          FINAL_TREE="$(git rev-parse HEAD^{tree})"
          test "$FINAL_TREE" = "$EXPECTED_TREE"
          test -z "$(git status --porcelain)"
          python -I -S -B tools/check_release_reproducibility.py \
            --repository . \
            --commit HEAD
          test -z "$(git status --porcelain)"
          git push origin HEAD:refs/heads/audit/codeprobe-hostile-remediation
          printf 'sha=%s\n' "$FINAL_SHA" >> "$GITHUB_OUTPUT"
          printf 'tree=%s\n' "$FINAL_TREE" >> "$GITHUB_OUTPUT"
