name: R01 exact candidate controller

on:
  push:
    branches:
      - audit/codeprobe-r01-controller-20260911
    paths:
      - .github/workflows/r01-controller.yml

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: codeprobe-r01-exact-candidate-controller
  cancel-in-progress: false

jobs:
  r01:
    name: Persist, verify and test the exact R01 candidate
    if: github.actor == 'antonioclim'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      REPOSITORY: antonioclim/CODEPROBE_PROJECTS_v2
      BASE_COMMIT: d5e1aa9e86e855f05ea570de22110aefc972b400
      BASE_TREE: dbffa8876ed833ceb9da6188255f215dc2dbf4ff
      EXPECTED_TREE: 6c24e2c7882848746f8d9aa5e9389b958fbacb20
      KNOWN_STAGING_ROOT: a539d4243c985ce73bde92c72439d9cca68a3618
      AUDIT_BRANCH: audit/codeprobe-i14-runtime-config-20260909
      CONTROLLER_BRANCH: audit/codeprobe-r01-controller-20260911
      PR_NUMBER: '6'
      CARRIERS: |
