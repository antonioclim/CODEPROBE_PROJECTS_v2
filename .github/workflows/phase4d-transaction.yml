name: Phase 4D changelog and evidence correction

on:
  push:
    branches:
      - audit/codeprobe-hostile-remediation
    paths:
      - .github/workflows/phase4d-transaction.yml

permissions:
  contents: write

concurrency:
  group: codeprobe-phase4d-changelog-correction
  cancel-in-progress: false

jobs:
  correct:
    name: verify_and_persist_changelog_correction
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUTF8: "1"
      PYTHONHASHSEED: "31413"
      CODEPROBE_REQUIRE_HTTP_NAVIGATION: "1"
    steps:
      - name: Check out the exact audit branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: audit/codeprobe-hostile-remediation
          clean: true
          fetch-depth: 0
          lfs: false
          persist-credentials: true
          show-progress: false
          submodules: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          architecture: x64
          check-latest: false
          python-version: "3.14.7"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          architecture: x64
          check-latest: false
          node-version: "24.20.0"
          package-manager-cache: false

      - name: Correct the changelog in the verified clean candidate
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_PAYLOAD_SHA256='c09ac98f1bfdf52a792802d46774bed13255d58107f1ed28caebe5668a45e621'
          EXPECTED_PATCH_SHA256='1fce993de9ef142a8738bc2c053c445545fe54cc48d00a7ee55618383957e2db'
          EXPECTED_FINAL_TREE='a4f7b7274565db94f284e0d38c934ce71c1886f4'

          cp .github/workflows/ci.yml /tmp/phase4d-ci-old.yml
          cp .github/workflows/phase4c-pyodide-measure.yml /tmp/phase4c-measure.yml
          cp .github/workflows/phase4d-transaction.yml /tmp/phase4d-transaction.yml
          cp -a .github/phase4d-payload /tmp/phase4d-payload

          cat .github/phase4d-payload/part-* > /tmp/phase4d-payload.b64
          printf '%s  %s\n' "$EXPECTED_PAYLOAD_SHA256" /tmp/phase4d-payload.b64 \
            | sha256sum --check --strict
          base64 --decode /tmp/phase4d-payload.b64 \
            | gzip --decompress > /tmp/codeprobe-phase4d.patch
          printf '%s  %s\n' "$EXPECTED_PATCH_SHA256" /tmp/codeprobe-phase4d.patch \
            | sha256sum --check --strict

          rm -f .github/workflows/phase4c-pyodide-measure.yml
          rm -f .github/workflows/phase4d-transaction.yml
          rm -rf .github/phase4d-payload
          git show \
            23496aa15cac7a3c2f56d0e4c8de8786f5d39f7b:.github/workflows/ci.yml \
            > .github/workflows/ci.yml
          git apply --binary --whitespace=nowarn \
            --include=.github/workflows/ci.yml \
            /tmp/codeprobe-phase4d.patch

          python -I -S -B - <<'PY'
          from __future__ import annotations
          from pathlib import Path

          changelog = Path('CHANGELOG.md')
          text = changelog.read_text(encoding='utf-8')
          unique_phase4d_lines = (
              '- Add a version-pinned `sys.monitoring` executable-line coverage gate with weighted overall, root and high-risk file floors, required by aggregate CI.',
              '- Add a constrained local static server that publishes only declared browser resources, rejects directory indexes and unsafe paths and requires explicit approval for non-loopback binding.',
              '- Add one bounded process broker with independent output ceilings, wall-clock timeout and process-tree termination on supported POSIX and Windows runners.',
              '- Add a measured Pyodide 0.25.0 core-startup provenance manifest and fail-closed browser verification for loader, lockfile, standard library and WebAssembly startup artefacts.',
              '- Replace the first coverage prototype after an adversarial syntax-depth test disabled the conventional tracer and underreported all later tests; the final monitor is independent of `sys.settrace` and disables each line event after its first observation.',
              '- Enforce network-binding policy inside the reusable server factory and fail closed when a Windows child cannot be assigned to a Job Object.',
          )
          lines = text.splitlines()
          before = {line: lines.count(line) for line in unique_phase4d_lines}
          if any(count < 2 for count in before.values()):
              raise SystemExit(f'unexpected changelog duplication counts: {before!r}')

          seen: set[str] = set()
          corrected: list[str] = []
          for line in lines:
              if line in unique_phase4d_lines:
                  if line in seen:
                      continue
                  seen.add(line)
              corrected.append(line)

          result = '\n'.join(corrected) + '\n'
          after_lines = result.splitlines()
          after = {line: after_lines.count(line) for line in unique_phase4d_lines}
          if any(count != 1 for count in after.values()):
              raise SystemExit(f'changelog correction was not exact: {after!r}')
          changelog.write_text(result, encoding='utf-8')
          PY

          python -I -S -B tools/check_coverage.py \
            --json-out "$RUNNER_TEMP/codeprobe-supported-coverage.json"
          python -I -S -B tools/check_release.py \
            --require-node \
            --write-release-evidence
          python -I -S -B tools/check_release.py --require-node
          node tools/check_browser_accessibility.js
          find . -type d -name __pycache__ -prune -exec rm -rf '{}' +
          git add -A
          git diff --cached --check
          test "$(git write-tree)" = "$EXPECTED_FINAL_TREE"

      - name: Persist only the non-workflow correction
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/phase4d-ci-old.yml .github/workflows/ci.yml
          cp /tmp/phase4c-measure.yml .github/workflows/phase4c-pyodide-measure.yml
          cp /tmp/phase4d-transaction.yml .github/workflows/phase4d-transaction.yml
          cp -a /tmp/phase4d-payload .github/phase4d-payload
          find . -type d -name __pycache__ -prune -exec rm -rf '{}' +
          git add -A
          git diff --cached --check

          mapfile -t changed < <(git diff --cached --name-only | sort)
          printf '%s\n' CHANGELOG.md release/release-manifest.json \
            | sort > /tmp/expected-phase4d-correction.txt
          printf '%s\n' "${changed[@]}" > /tmp/actual-phase4d-correction.txt
          diff -u /tmp/expected-phase4d-correction.txt /tmp/actual-phase4d-correction.txt

          git config user.name 'Revolvix'
          git config user.email '48681843+antonioclim@users.noreply.github.com'
          git commit -m 'Keep Phase 4D changes in the unreleased changelog'
          git push origin HEAD:refs/heads/audit/codeprobe-hostile-remediation
