name: Phase 4D final tree materialisation

on:
  push:
    branches:
      - audit/codeprobe-hostile-remediation
    paths:
      - .github/workflows/phase4d-transaction.yml

permissions:
  contents: write

concurrency:
  group: codeprobe-phase4d-final-tree
  cancel-in-progress: false

jobs:
  materialise:
    name: materialise_verified_tree
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the exact audit branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: audit/codeprobe-hostile-remediation
          clean: true
          fetch-depth: 0
          lfs: false
          persist-credentials: false
          show-progress: false
          submodules: false

      - name: Materialise the already verified final Git tree
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_PAYLOAD_SHA256: c09ac98f1bfdf52a792802d46774bed13255d58107f1ed28caebe5668a45e621
          EXPECTED_PATCH_SHA256: 1fce993de9ef142a8738bc2c053c445545fe54cc48d00a7ee55618383957e2db
          EXPECTED_CI_BLOB: 1155390c3beefa85501ece58f999224d38f521c6
          EXPECTED_FINAL_TREE: e42915c9a7d77bf7ad5e2259660ef3d6d9535700
        run: |
          set -euo pipefail

          cat .github/phase4d-payload/part-* > /tmp/phase4d-payload.b64
          printf '%s  %s\n' "$EXPECTED_PAYLOAD_SHA256" /tmp/phase4d-payload.b64 \
            | sha256sum --check --strict
          base64 --decode /tmp/phase4d-payload.b64 \
            | gzip --decompress > /tmp/codeprobe-phase4d.patch
          printf '%s  %s\n' "$EXPECTED_PATCH_SHA256" /tmp/codeprobe-phase4d.patch \
            | sha256sum --check --strict

          CI_WORK="$(mktemp -d)"
          cleanup() {
            rm -rf "$CI_WORK"
          }
          trap cleanup EXIT
          git -C "$CI_WORK" init --quiet
          mkdir -p "$CI_WORK/.github/workflows"
          git show \
            23496aa15cac7a3c2f56d0e4c8de8786f5d39f7b:.github/workflows/ci.yml \
            > "$CI_WORK/.github/workflows/ci.yml"
          git -C "$CI_WORK" apply --binary --whitespace=nowarn \
            --include=.github/workflows/ci.yml \
            /tmp/codeprobe-phase4d.patch
          ACTUAL_CI_BLOB="$(git -C "$CI_WORK" hash-object .github/workflows/ci.yml)"
          test "$ACTUAL_CI_BLOB" = "$EXPECTED_CI_BLOB"

          CI_FILE="$CI_WORK/.github/workflows/ci.yml" \
            python -I -S -B - <<'PY' > /tmp/phase4d-blob-request.json
          from __future__ import annotations
          import base64
          import json
          import os
          from pathlib import Path

          payload = Path(os.environ['CI_FILE']).read_bytes()
          print(json.dumps({
              'content': base64.b64encode(payload).decode('ascii'),
              'encoding': 'base64',
          }, separators=(',', ':')))
          PY

          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --data-binary @/tmp/phase4d-blob-request.json \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/blobs" \
            > /tmp/phase4d-blob-response.json

          ACTUAL_CI_BLOB="$(python -I -S -B - <<'PY'
          import json
          from pathlib import Path
          print(json.loads(Path('/tmp/phase4d-blob-response.json').read_text())['sha'])
          PY
          )"
          test "$ACTUAL_CI_BLOB" = "$EXPECTED_CI_BLOB"

          BASE_TREE="$(git rev-parse 'HEAD^{tree}')" \
          CI_BLOB="$ACTUAL_CI_BLOB" \
            python -I -S -B - <<'PY' > /tmp/phase4d-tree-request.json
          from __future__ import annotations
          import json
          import os

          entries = [{
              'path': '.github/workflows/ci.yml',
              'mode': '100644',
              'type': 'blob',
              'sha': os.environ['CI_BLOB'],
          }]
          deleted = [
              *(f'.github/phase4d-payload/part-{index:02d}' for index in range(12)),
              '.github/workflows/phase4c-pyodide-measure.yml',
              '.github/workflows/phase4d-transaction.yml',
          ]
          entries.extend({
              'path': path,
              'mode': '100644',
              'type': 'blob',
              'sha': None,
          } for path in deleted)
          print(json.dumps({
              'base_tree': os.environ['BASE_TREE'],
              'tree': entries,
          }, separators=(',', ':')))
          PY

          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --data-binary @/tmp/phase4d-tree-request.json \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/trees" \
            > /tmp/phase4d-tree-response.json

          ACTUAL_FINAL_TREE="$(python -I -S -B - <<'PY'
          import json
          from pathlib import Path
          print(json.loads(Path('/tmp/phase4d-tree-response.json').read_text())['sha'])
          PY
          )"
          test "$ACTUAL_FINAL_TREE" = "$EXPECTED_FINAL_TREE"
          printf 'FINAL_TREE=%s\n' "$ACTUAL_FINAL_TREE"

          cleanup
          trap - EXIT
