name: Publish CodeProbe v2.2.0-rc.1

on:
  push:
    branches:
      - release/publish-v2.2.0-rc.1-20260906
    paths:
      - .github/workflows/publish-v2.2.0-rc.1.yml

permissions: {}
concurrency:
  group: codeprobe-publish-v2.2.0-rc.1
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
      checks: read
    defaults:
      run:
        shell: bash
        working-directory: candidate
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
    steps:
      - name: Read this publication orchestration only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: orchestration
          persist-credentials: false
      - name: Check out the exact audited product source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 2d38fbd3772a9f415dfcc52ab2840aadd15575e3
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - name: Define the external output directory on the runner
        run: echo "RELEASE_WORK=$RUNNER_TEMP/codeprobe-release" >> "$GITHUB_ENV"
      - name: Set up the supported Python runtime
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.7'
          architecture: x64
          check-latest: false
      - name: Set up the supported Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.20.0'
          package-manager-cache: false
      - name: Check the exact source and successful canonical CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -I -S -B ../orchestration/.github/release/publish_rc1.py preflight --work "$RELEASE_WORK"
      - name: Rerun the complete read-only gate without weakening checks
        run: |
          set -euo pipefail
          mkdir -p "$RELEASE_WORK/assets"
          python -I -S -B tools/check_release.py --require-node --json-out "$RELEASE_WORK/fresh-gate.json" | tee "$RELEASE_WORK/fresh-gate.log"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Build unchanged verified bytes and prepare public notes
        run: |
          set -euo pipefail
          python -I -S -B tools/build_release.py --skip-tests --out "$RELEASE_WORK/assets/CodeProbe_Project_Kit_v2.2.0-rc.1.zip" | tee "$RELEASE_WORK/packet-build.log"
          python -I -S -B ../orchestration/.github/release/publish_rc1.py prepare --work "$RELEASE_WORK"
      - name: Publish the exact tag and five verified release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python -I -S -B ../orchestration/.github/release/publish_rc1.py publish --work "$RELEASE_WORK" | tee "$RELEASE_WORK/publication.log"
      - name: Preserve publication evidence and local asset copies
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codeprobe-release-v2.2.0-rc.1-evidence
          path: ${{ runner.temp }}/codeprobe-release/
          if-no-files-found: warn
          retention-days: 30
          compression-level: 9
