name: Phase 4H verified contract transaction
on:
  push:
    branches:
      - automation/phase4f3-worker-20260906
permissions:
  contents: read
jobs:
  verify:
    if: github.actor == 'antonioclim'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    permissions:
      contents: write
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
      PYTHONHASHSEED: '31410'
    steps:
      - name: Check out the exact authorised baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 09f4d81c5bfcb0b2f7ebfa12d180a00962d2a0f8
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.7'
          architecture: x64
          check-latest: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.20.0'
          architecture: x64
          check-latest: false
          package-manager-cache: false
      - name: Authenticate and apply the exact candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '09f4d81c5bfcb0b2f7ebfa12d180a00962d2a0f8'
          python -I -S -B - <<'PY'
          import base64, hashlib, json, lzma, os, pathlib, urllib.request
          shas = ['9998a1de4ca1a6be2bba3c252488f4a797ade455', '591ee4da79dfc44d5e344cae2932681f73321604', '904368958cfa9687685def698d4c5986f8156a1e', 'bc4e9c2a4743c80fc1a30dca7f286d77008d5dae', 'b680f2539032d231e340b025332089024f676e97', '335a3c383fa7fa9c22192d189c1e77e5e1616f7e']
          headers = {'Accept': 'application/vnd.github+json', 'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'User-Agent': 'CodeProbe-4H'}
          parts = []
          for sha in shas:
              url = 'https://api.github.com/repos/antonioclim/CODEPROBE_PROJECTS_v2/git/blobs/' + sha
              with urllib.request.urlopen(urllib.request.Request(url, headers=headers), timeout=30) as response:
                  record = json.load(response)
              content = base64.b64decode(record['content'])
              actual = hashlib.sha1(b'blob ' + str(len(content)).encode() + b'\0' + content).hexdigest()
              if actual != sha:
                  raise SystemExit('Transport blob mismatch')
              parts.append(content)
          patch = lzma.decompress(base64.b64decode(b''.join(parts), validate=True))
          if len(patch) != 116637 or hashlib.sha256(patch).hexdigest() != '70e9832c99e4d0a122fcf162665a66b2851c87c6d68fa79748c78835e568ec2f':
              raise SystemExit('Candidate patch mismatch')
          pathlib.Path('/tmp/codeprobe-4h.patch').write_bytes(patch)
          PY
          git apply --unidiff-zero --binary /tmp/codeprobe-4h.patch
          git add --all
          git diff --cached --check
          test "$(git write-tree)" = '03cbbf2ec7df6c347a0eecdb2898c1888ac462d5'
      - name: Run the complete read-only canonical gate
        shell: bash
        run: |
          set -euo pipefail
          python -I -S -B tools/check_release.py --require-node | tee /tmp/4h-gate.log
      - name: Measure supported-code coverage without lowering floors
        shell: bash
        run: |
          set -euo pipefail
          python -I -S -B tools/check_coverage.py --json-out /tmp/coverage-4h.json | tee /tmp/4h-coverage.log
      - name: Prepare authenticated Pyodide fixture
        if: success() || failure()
        shell: bash
        run: python -I -S -B tools/prepare_pyodide_fixture.py --output-dir /tmp/pyodide-core --json-out /tmp/pyodide-core.json
      - name: Verify actual Pyodide input ownership, exports, replay and integrity
        if: success() || failure()
        shell: bash
        env:
          CODEPROBE_PYODIDE_FIXTURE_DIR: /tmp/pyodide-core
          CODEPROBE_REQUIRE_HTTP_NAVIGATION: '1'
        run: |
          set -euo pipefail
          node tools/check_browser_functional.js | tee /tmp/4h-browser.log
      - name: Verify accessibility in a real browser
        if: success() || failure()
        shell: bash
        env:
          CODEPROBE_REQUIRE_HTTP_NAVIGATION: '1'
        run: |
          set -euo pipefail
          node tools/check_browser_accessibility.js | tee /tmp/4h-accessibility.log
      - name: Upload only verified immutable Git objects and evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git write-tree)" = '03cbbf2ec7df6c347a0eecdb2898c1888ac462d5'
          git diff --exit-code
          python -I -S -B - <<'PY'
          import base64, json, os, pathlib, subprocess, urllib.request
          root = pathlib.Path.cwd()
          api = 'https://api.github.com/repos/antonioclim/CODEPROBE_PROJECTS_v2/git/'
          headers = {'Accept': 'application/vnd.github+json', 'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Content-Type': 'application/json', 'User-Agent': 'CodeProbe-4H'}
          def post(route, payload):
              request = urllib.request.Request(api + route, data=json.dumps(payload).encode(), headers=headers, method='POST')
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)
          paths = subprocess.check_output(['git', 'diff', '--cached', '--name-only', '-z']).decode().split('\0')
          entries = []
          for name in filter(None, paths):
              path = root / name
              if not path.is_file() or path.is_symlink():
                  raise SystemExit('Only regular additions/replacements are allowed')
              local_sha = subprocess.check_output(['git', 'hash-object', name]).decode().strip()
              result = post('blobs', {'content': base64.b64encode(path.read_bytes()).decode(), 'encoding': 'base64'})
              if result['sha'] != local_sha:
                  raise SystemExit('Source blob mismatch: ' + name)
              entries.append({'path': name, 'mode': '100644', 'type': 'blob', 'sha': local_sha})
          result = post('trees', {'base_tree': '56a93711260d7bae47eceba0172b10b2d9b86336', 'tree': entries})
          if result['sha'] != '03cbbf2ec7df6c347a0eecdb2898c1888ac462d5':
              raise SystemExit('Remote tree mismatch')
          print('VERIFIED_REMOTE_TREE=' + result['sha'])
          evidence = {'schema': 'codeprobe-4h-staging-evidence/v1', 'tree': result['sha'], 'run_id': os.environ['GITHUB_RUN_ID'], 'logs': {}}
          for name in ['gate', 'coverage', 'browser', 'accessibility']:
              evidence['logs'][name] = pathlib.Path('/tmp/4h-' + name + '.log').read_text()
          stored = post('blobs', {'content': json.dumps(evidence, indent=2), 'encoding': 'utf-8'})
          print('VERIFIED_EVIDENCE_BLOB=' + stored['sha'])
          print('No branch reference was changed by this job.')
          PY
