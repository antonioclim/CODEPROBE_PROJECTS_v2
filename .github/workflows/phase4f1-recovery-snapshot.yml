name: Phase 4F1 verified recovery transaction

on:
  push:
    branches:
      - audit/codeprobe-hostile-remediation
    paths:
      - .github/workflows/phase4f1-recovery-snapshot.yml

permissions:
  contents: write

concurrency:
  group: phase4f1-recovery-transaction
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact transaction commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true
          fetch-depth: 0
          lfs: false
          persist-credentials: true
          show-progress: false
          submodules: false

      - name: Reconstruct and verify the exact candidate
        shell: bash
        env:
          BASE_SHA: e6ac407e25a3f52739ad1f079bde65e48e62941e
          EXPECTED_TREE: f5e8d04d24f2fdcdb278c7fc166fe501dddf946b
          BASE64_SHA256: 6f9a2b3cf08bf973ced4b7039bffbcf978316ba849eaa0bb58482329013f796e
          GZIP_SHA256: cb84fd0274fdecf08620f6184b686447f6e719c48c5a3ce047e72ebfeb9c4838
          PATCH_SHA256: 87b3d5e5c2329a2b9ea9799cbcc792b4d1b8b6dd47b0ea8396039b5b11de0591
          PART03_SHA256: aa33fea1bb21b768d067af394e1adbee52899ec53216dcec53a12f91084ee475
        run: |
          set -euo pipefail
          encoded="$RUNNER_TEMP/phase4f1.patch.gz.b64"
          compressed="$RUNNER_TEMP/phase4f1.patch.gz"
          patch="$RUNNER_TEMP/phase4f1.patch"
          candidate="$RUNNER_TEMP/phase4f1-candidate"
          ENCODED="$encoded" PART03_SHA256="$PART03_SHA256" python -I -S -B - <<'PY'
          import hashlib
          import os
          from pathlib import Path

          root = Path('.github/phase4f1-patch')
          parts = []
          for index in range(9):
              path = root / f'part-{index:02d}.b64'
              data = path.read_bytes().replace(b'\r', b'').replace(b'\n', b'')
              if index == 3:
                  expected = os.environ['PART03_SHA256']
                  if hashlib.sha256(data).hexdigest() != expected:
                      if len(data) != 8191:
                          raise SystemExit(f'part-03 has unexpected size {len(data)}')
                      alphabet = b'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/='
                      repaired = None
                      for offset in range(len(data) + 1):
                          prefix = data[:offset]
                          suffix = data[offset:]
                          for value in alphabet:
                              candidate = prefix + bytes((value,)) + suffix
                              if hashlib.sha256(candidate).hexdigest() == expected:
                                  repaired = candidate
                                  break
                          if repaired is not None:
                              break
                      if repaired is None:
                          raise SystemExit('part-03 could not be repaired against its pinned digest')
                      data = repaired
                  if hashlib.sha256(data).hexdigest() != expected:
                      raise SystemExit('part-03 digest mismatch after repair')
              parts.append(data)
          Path(os.environ['ENCODED']).write_bytes(b''.join(parts))
          PY
          printf '%s  %s\n' "$BASE64_SHA256" "$encoded" | sha256sum --check --strict
          base64 --decode "$encoded" > "$compressed"
          printf '%s  %s\n' "$GZIP_SHA256" "$compressed" | sha256sum --check --strict
          gzip -dc "$compressed" > "$patch"
          printf '%s  %s\n' "$PATCH_SHA256" "$patch" | sha256sum --check --strict
          git config user.name "CodeProbe recovery transaction"
          git config user.email "48681843+antonioclim@users.noreply.github.com"
          git fetch --no-tags origin "$BASE_SHA"
          git worktree add --detach "$candidate" "$BASE_SHA"
          git -C "$candidate" config user.name "Revolvix"
          git -C "$candidate" config user.email "48681843+antonioclim@users.noreply.github.com"
          git -C "$candidate" am --committer-date-is-author-date "$patch"
          actual_tree="$(git -C "$candidate" rev-parse HEAD^{tree})"
          test "$actual_tree" = "$EXPECTED_TREE"
          test -z "$(git -C "$candidate" status --porcelain=v1 --untracked-files=all)"

          (
            cd "$candidate"
            python -I -S -B -m unittest discover -s tests -v
            python -I -S -B tools/check_dependency_boundary.py
            python -I -S -B tools/check_pyodide_provenance.py
            python -I -S -B tools/check_release.py --require-node
            python -I -S -B tools/check_release_reproducibility.py --repository . --commit HEAD
            node tools/check_browser_accessibility.js
          )

          CANDIDATE="$candidate" python -I -S -B - <<'PY'
          import os
          import shutil
          import subprocess
          from pathlib import Path

          root = Path.cwd()
          candidate = Path(os.environ['CANDIDATE'])
          candidate_paths = set(
              subprocess.check_output(
                  ['git', '-C', str(candidate), 'ls-files', '-z']
              ).decode('utf-8').split('\0')[:-1]
          )
          current_paths = set(
              subprocess.check_output(['git', 'ls-files', '-z'])
              .decode('utf-8').split('\0')[:-1]
          )
          preserved = {'.github/phase4f1-candidate.patch.gz.b64'}
          for relative in sorted(current_paths - candidate_paths):
              if relative.startswith('.github/workflows/') or relative in preserved:
                  continue
              target = root / relative
              if target.is_file() or target.is_symlink():
                  target.unlink()
          for relative in sorted(candidate_paths):
              if relative.startswith('.github/workflows/'):
                  continue
              source = candidate / relative
              target = root / relative
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(source, target)
              target.chmod(source.stat().st_mode & 0o777)
          PY

          git add -A -- . ':(exclude).github/workflows/**' ':(exclude).github/phase4f1-candidate.patch.gz.b64'
          test -n "$(git diff --cached --name-only)"
          if git diff --cached --name-only | grep -q '^.github/workflows/'; then
            printf '%s\n' 'A workflow path entered the intermediate commit.' >&2
            exit 1
          fi
          git commit -m "Materialise the verified Phase 4F1 runtime candidate"
          git push origin HEAD:refs/heads/audit/codeprobe-hostile-remediation

      - name: Record the intermediate commit
        shell: bash
        run: |
          set -euo pipefail
          {
            printf 'commit=%s\n' "$(git rev-parse HEAD)"
            printf 'tree=%s\n' "$(git rev-parse HEAD^{tree})"
            printf 'candidate_tree=%s\n' f5e8d04d24f2fdcdb278c7fc166fe501dddf946b
          } > "$RUNNER_TEMP/phase4f1-intermediate.txt"

      - name: Upload transaction evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: phase4f1-recovery-${{ github.sha }}
          path: ${{ runner.temp }}/phase4f1-intermediate.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
