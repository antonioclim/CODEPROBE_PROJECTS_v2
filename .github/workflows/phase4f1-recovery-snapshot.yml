name: Phase 4F1 exact CI blob

on:
  push:
    branches:
      - audit/codeprobe-hostile-remediation
    paths:
      - .github/workflows/phase4f1-recovery-snapshot.yml

permissions:
  contents: write

jobs:
  create_blob:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Materialise and create the exact candidate CI blob
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_GZIP_SHA256: 3197c9f49cd80eb7b9c76525d93d0aa679f5b7e8bba772f8606e3d3e7c1c5918
          EXPECTED_RAW_SHA256: 86456dc1157288ba61b6bbc36d5486861d903bacc6814e44762a07557a04cf8a
          EXPECTED_BLOB_SHA: d7d46fedcb5fa431d42bc8e75f584105e5f37a0b
        run: |
          set -euo pipefail
          encoded="$RUNNER_TEMP/ci.yml.gz.b64"
          compressed="$RUNNER_TEMP/ci.yml.gz"
          raw="$RUNNER_TEMP/ci.yml"
          cat > "$encoded" <<'B64'

B64
          tr -d '\r\n' < "$encoded" | base64 --decode > "$compressed"
          printf '%s  %s\n' "$EXPECTED_GZIP_SHA256" "$compressed" | sha256sum --check --strict
          gzip -dc "$compressed" > "$raw"
          printf '%s  %s\n' "$EXPECTED_RAW_SHA256" "$raw" | sha256sum --check --strict
          test "$(git hash-object "$raw")" = "$EXPECTED_BLOB_SHA"
          RAW="$raw" python -I -S -B - <<'PY'
          import base64
          import json
          import os
          import urllib.request
          from pathlib import Path

          raw = Path(os.environ['RAW']).read_bytes()
          payload = json.dumps({
              'content': base64.b64encode(raw).decode('ascii'),
              'encoding': 'base64',
          }).encode('utf-8')
          request = urllib.request.Request(
              f"{os.environ['GITHUB_API_URL']}/repos/{os.environ['GITHUB_REPOSITORY']}/git/blobs",
              data=payload,
              method='POST',
              headers={
                  'Accept': 'application/vnd.github+json',
                  'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
                  'Content-Type': 'application/json',
                  'X-GitHub-Api-Version': '2022-11-28',
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              result = json.load(response)
          expected = os.environ['EXPECTED_BLOB_SHA']
          if result.get('sha') != expected:
              raise SystemExit(f"blob SHA mismatch: {result.get('sha')} != {expected}")
          Path(os.environ['RUNNER_TEMP'], 'phase4f1-ci-blob.json').write_text(
              json.dumps(result, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          PY

      - name: Upload exact blob evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: phase4f1-ci-blob-${{ github.sha }}
          path: ${{ runner.temp }}/phase4f1-ci-blob.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
