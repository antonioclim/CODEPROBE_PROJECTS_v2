name: Phase 4D Python 3.10 test correction

on:
  push:
    branches:
      - audit/codeprobe-hostile-remediation
    paths:
      - .github/workflows/phase4d-py310-test-fix.yml

permissions:
  contents: write

concurrency:
  group: codeprobe-phase4d-py310-test-correction
  cancel-in-progress: false

jobs:
  correct:
    name: verify_and_persist_py310_test_correction
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUTF8: "1"
      PYTHONHASHSEED: "31022"
    steps:
      - name: Check out the exact audit branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: audit/codeprobe-hostile-remediation
          clean: true
          fetch-depth: 0
          lfs: false
          persist-credentials: true
          show-progress: false
          submodules: false

      - name: Set up Python 3.10
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          architecture: x64
          check-latest: false
          python-version: "3.10.21"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          architecture: x64
          check-latest: false
          node-version: "24.20.0"
          package-manager-cache: false

      - name: Reconstruct the reviewed correction
        shell: bash
        run: |
          set -euo pipefail
          PARENT='efd5ca373315bdee4002555cc09d53d83b233c20'
          EXPECTED_TREE='193aea2a2bdb622ae657bd74da0886a052fafbbc'

          test "$(git rev-parse HEAD^)" = "$PARENT"
          cp .github/workflows/phase4d-py310-test-fix.yml \
            /tmp/phase4d-py310-test-fix.yml
          rm .github/workflows/phase4d-py310-test-fix.yml

          python -I -S -B - <<'PY'
          from pathlib import Path

          path = Path('tests/test_coverage_policy.py')
          text = path.read_text(encoding='utf-8')
          old = '''    def test_monitoring_is_not_silenced_by_a_test_that_clears_sys_trace(self) -> None:\n        with tempfile.TemporaryDirectory() as tmp:\n'''
          new = '''    def test_monitoring_is_not_silenced_by_a_test_that_clears_sys_trace(self) -> None:\n        if not hasattr(sys, "monitoring"):\n            with self.assertRaisesRegex(\n                coverage.CoveragePolicyError,\n                "requires CPython with the sys.monitoring API",\n            ):\n                coverage._monitoring_api()\n            return\n\n        with tempfile.TemporaryDirectory() as tmp:\n'''
          if new in text:
              raise SystemExit('portable coverage test is already present')
          if old not in text:
              raise SystemExit('expected coverage test insertion point is absent')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

          find . -type d -name __pycache__ -prune -exec rm -rf '{}' +
          git add -A
          git diff --cached --check

      - name: Verify the correction under Python 3.10
        shell: bash
        run: |
          set -euo pipefail
          python -I -S -B -m unittest discover \
            -s tests -p 'test_coverage_policy.py' -v
          python -I -S -B -m unittest discover -s tests -v 2>&1 \
            | tee /tmp/codeprobe-phase4d-py310-tests.log
          COUNT="$(sed -nE 's/^Ran ([0-9]+) tests?.*/\1/p' \
            /tmp/codeprobe-phase4d-py310-tests.log | tail -n 1)"
          test "$COUNT" = '353'
          python -I -S -B tools/check_dependency_boundary.py
          python -I -S -B tools/check_pyodide_provenance.py
          python -I -S -B tools/check_release.py \
            --require-node \
            --write-release-evidence
          python -I -S -B tools/check_release.py --require-node
          find . -type d -name __pycache__ -prune -exec rm -rf '{}' +
          git add -A
          git diff --cached --check
          test "$(git write-tree)" = '193aea2a2bdb622ae657bd74da0886a052fafbbc'

      - name: Verify exact-commit reproducibility in a clean clone
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Revolvix'
          git config user.email '48681843+antonioclim@users.noreply.github.com'
          CANDIDATE_COMMIT="$(printf '%s\n' \
            'Make the coverage adversarial test portable' \
            | git commit-tree '193aea2a2bdb622ae657bd74da0886a052fafbbc' \
                -p 'efd5ca373315bdee4002555cc09d53d83b233c20')"
          CLEAN_ROOT="$(mktemp -d)"
          cleanup() {
            git update-ref -d refs/heads/phase4d-py310-candidate 2>/dev/null || true
            rm -rf "$CLEAN_ROOT"
          }
          trap cleanup EXIT
          git update-ref refs/heads/phase4d-py310-candidate "$CANDIDATE_COMMIT"
          git clone --local --no-hardlinks --branch phase4d-py310-candidate \
            --single-branch . "$CLEAN_ROOT/repository"
          test -z "$(git -C "$CLEAN_ROOT/repository" status \
            --porcelain=v1 --untracked-files=all)"
          python -I -S -B \
            "$CLEAN_ROOT/repository/tools/check_release_reproducibility.py" \
            --repository "$CLEAN_ROOT/repository" \
            --commit "$CANDIDATE_COMMIT"
          cleanup
          trap - EXIT

      - name: Publish only the verified non-workflow correction
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/phase4d-py310-test-fix.yml \
            .github/workflows/phase4d-py310-test-fix.yml
          find . -type d -name __pycache__ -prune -exec rm -rf '{}' +
          git add -A
          git diff --cached --check

          mapfile -t changed < <(git diff --cached --name-only | sort)
          printf '%s\n' \
            release/release-manifest.json \
            tests/test_coverage_policy.py \
            | sort > /tmp/phase4d-py310-expected.txt
          printf '%s\n' "${changed[@]}" > /tmp/phase4d-py310-actual.txt
          diff -u /tmp/phase4d-py310-expected.txt /tmp/phase4d-py310-actual.txt

          git config user.name 'Revolvix'
          git config user.email '48681843+antonioclim@users.noreply.github.com'
          git commit -m 'Make the coverage adversarial test portable'
          git push origin HEAD:refs/heads/audit/codeprobe-hostile-remediation
