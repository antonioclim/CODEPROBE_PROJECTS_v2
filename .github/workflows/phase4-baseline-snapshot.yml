name: Phase 4 baseline snapshot

on:
  push:
    branches:
      - audit/codeprobe-hostile-remediation
    paths:
      - .github/workflows/phase4-baseline-snapshot.yml

permissions:
  contents: read

concurrency:
  group: codeprobe-phase4-baseline-snapshot
  cancel-in-progress: false

jobs:
  export:
    if: ${{ github.actor == 'antonioclim' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the snapshot commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true
          fetch-depth: 2
          lfs: false
          persist-credentials: false
          show-progress: false
          submodules: false

      - name: Export the clean parent and runner browser inventory
        shell: bash
        run: |
          set -euo pipefail
          parent="$(git rev-parse HEAD^)"
          test "$parent" = '43475afc38140087143d62e3002e2a273b2a74e9'
          git archive --format=zip --output=/tmp/codeprobe-phase4-baseline.zip "$parent"
          {
            printf 'snapshot_commit=%s\n' "$parent"
            printf 'snapshot_tree=%s\n' "$(git rev-parse "$parent^{tree}")"
            printf 'runner_os=%s\n' "$(uname -a)"
            printf 'node=%s\n' "$(node --version 2>/dev/null || true)"
            node -e 'console.log(`node_global_websocket=${typeof WebSocket}`)' 2>/dev/null || true
            for candidate in google-chrome google-chrome-stable chromium chromium-browser firefox microsoft-edge; do
              if command -v "$candidate" >/dev/null 2>&1; then
                printf '%s_path=%s\n' "$candidate" "$(command -v "$candidate")"
                "$candidate" --version 2>&1 | sed "s/^/${candidate}_version=/"
              fi
            done
          } > /tmp/phase4-runner-browser-inventory.txt
          sha256sum /tmp/codeprobe-phase4-baseline.zip > /tmp/codeprobe-phase4-baseline.zip.sha256

      - name: Upload the exact baseline
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: codeprobe-phase4-baseline-43475afc
          path: |
            /tmp/codeprobe-phase4-baseline.zip
            /tmp/codeprobe-phase4-baseline.zip.sha256
            /tmp/phase4-runner-browser-inventory.txt
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
