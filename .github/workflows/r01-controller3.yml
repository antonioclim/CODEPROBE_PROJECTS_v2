name: R01 exact candidate controller v3

on:
  push:
    branches:
      - audit/codeprobe-r01-controller3-20260911
    paths:
      - .github/workflows/r01-controller3.yml

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: codeprobe-r01-exact-candidate-controller-v3
  cancel-in-progress: false

jobs:
  recover-and-accept:
    name: Recover, persist and validate the exact R01 candidate
    if: github.actor == 'antonioclim'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      REPOSITORY: antonioclim/CODEPROBE_PROJECTS_v2
      BASE_COMMIT: d5e1aa9e86e855f05ea570de22110aefc972b400
      BASE_TREE: dbffa8876ed833ceb9da6188255f215dc2dbf4ff
      EXPECTED_TREE: 6c24e2c7882848746f8d9aa5e9389b958fbacb20
      STAGING_ROOT: a539d4243c985ce73bde92c72439d9cca68a3618
      AUDIT_BRANCH: audit/codeprobe-i14-runtime-config-20260909
      CONTROLLER_BRANCH: audit/codeprobe-r01-controller3-20260911
      DIAGNOSTIC_BRANCH: audit/codeprobe-r01-diagnostic-20260911
      PR_NUMBER: '6'
      CARRIERS: |
        43bd413ee78a0ee0223d39b74cfc9335d633ae99
        5515a223c53acc20fa6b0a1de000b84cc9d33154
        8f4d1fca272bcac614fb4bafbcb9ecf0cf66c88f
        b1cd53ca44d9339c611988bb0b0d967b4329354d
        6dd21d8692b90b2fcc7e0f99c7833007c0ba692f
        5768052b20694c143156cc2091b7275153756135
        2336eded2324562feaeec84bd75f96459e333f67
        7de52411edd6b84b0d9efc8422771ff428c356ba
        2e77ae2a924e512a757d877fa614d44a7b274c25
        8b2eef3036509bb8cf4fca3403fea28207f993aa
        9903aa044e9b9d76600d7dc17ed555ff3705486a
        79f942f983d8b17bfef54bbbab5ca63e43fd533a
      TARGETS: |
        README.md 1d8fe4710e5cbed0e1579f813ce9fc1c5a20f1c0 57355
        app/codeprobe-ui.js 995ce9bbbe12def1ebd1db4964d5f4702af9754a 90375
        app/codeprobe.css ac2db0ced202df21212cbd0511e2f14b246d4999 22077
        app/index.html 833f895fd0af547d95568fdf8c66e3837e5262df 19831
        app/project-ui.js 705ed151c94a7ce57027e8897607564e02a379c6 25983
        app/project.css ba920a84a59771206e778e1cca3d3092b288b3b6 4385
        app/project.html e265181e8c7aafad1b95c19b47842aa90be04aec 5412
        app/pyodide-loader.js e178061c2e023e57f739c7defb629f317f080910 39244
        app/resource-integrity.json eb3b2bea421fc7cc853660c1b0e735fdaf2886a0 2388
        app/vendor/pyodide/README.md 4c3103ff7d565839f87a6e792163ab20513481f6 1835
        docs/04-browser-security.md 49a10c59f8e3b9b66d2435f44aa232ce55d520c0 14540
        docs/05-offline-deployment.md 2d341777fbf8735b2a0f748323599ba3e3af87ec 12053
        docs/07-ui-extension-guide.md c901580a43dbf0e44355f96b175af3f8f81f030a 10637
