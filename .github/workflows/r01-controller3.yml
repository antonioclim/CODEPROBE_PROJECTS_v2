        docs/assets/interface-preview.png 8c27ba73c23cd7673877771dca4e763b0e754ac4 344045
        docs/history/07-institutional-packaging.md 778fc5681bf48628dbb66775d7379158d23196bd 15829
        educator/08-deployment-one-page.md dd0dae6a4b6a0ff7ae731f3a03de5772c639ce42 2639
        tests/test_app_runtime_tools_paths.py d93b33917e8ae0621aa1fdab0928bf25e8240797 9824
        tests/test_coverage_policy.py e433b1eb6b501cc782e97291d68c0081b3055194 13832
        tests/test_dependency_boundary.py 2862a6c8eb2eea63863c06e72f1a83a9501fff55 66021
