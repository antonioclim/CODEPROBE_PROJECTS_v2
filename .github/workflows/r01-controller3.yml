          set -euo pipefail
          python - <<'PY'
          import base64
          import json
          import os
          import pathlib
          import urllib.error
          import urllib.request

          repo = os.environ['REPOSITORY']
          base = os.environ['BASE_COMMIT']
          base_tree = os.environ['BASE_TREE']
          branch = os.environ['DIAGNOSTIC_BRANCH']
          token = os.environ['GH_TOKEN']
          source = pathlib.Path('/tmp/r01-controller3-outcome.json')
          if not source.exists():
              source.write_text('{"status":"FAIL","error":"controller ended before diagnostic initialisation"}\n', encoding='utf-8')
          payload = source.read_bytes()

          def api(method, path, body=None, allow_404=False):
              data = None if body is None else json.dumps(body, separators=(',', ':')).encode('utf-8')
              request = urllib.request.Request(
                  'https://api.github.com' + path,
                  data=data,
                  method=method,
                  headers={
                      'Authorization': f'Bearer {token}',
                      'Accept': 'application/vnd.github+json',
                      'X-GitHub-Api-Version': '2022-11-28',
                      'User-Agent': 'codeprobe-r01-controller-v3-diagnostic',
                      'Content-Type': 'application/json',
                  },
              )
              try:
                  with urllib.request.urlopen(request, timeout=90) as response:
                      raw = response.read()
                  return json.loads(raw) if raw else None
              except urllib.error.HTTPError as exc:
                  if allow_404 and exc.code == 404:
                      return None
                  raise

          blob = api('POST', f'/repos/{repo}/git/blobs', {'content': base64.b64encode(payload).decode('ascii'), 'encoding': 'base64'})
          tree = api(
              'POST',
              f'/repos/{repo}/git/trees',
              {
                  'base_tree': base_tree,
                  'tree': [{'path': 'r01/R01_DIAGNOSTIC.json', 'mode': '100644', 'type': 'blob', 'sha': blob['sha']}],
              },
          )
          commit = api(
              'POST',
              f'/repos/{repo}/git/commits',
              {'message': 'Record bounded R01 controller v3 diagnostic', 'tree': tree['sha'], 'parents': [base]},
          )
          current = api('GET', f'/repos/{repo}/git/ref/heads/{branch}', allow_404=True)
          if current is None:
              api('POST', f'/repos/{repo}/git/refs', {'ref': 'refs/heads/' + branch, 'sha': commit['sha']})
          else:
              api('PATCH', f'/repos/{repo}/git/refs/heads/{branch}', {'sha': commit['sha'], 'force': True})
          PY
