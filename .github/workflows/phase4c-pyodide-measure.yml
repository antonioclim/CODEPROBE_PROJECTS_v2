name: Phase 4C Pyodide provenance measurement

on:
  push:
    branches:
      - audit/codeprobe-hostile-remediation
    paths:
      - .github/workflows/phase4c-pyodide-measure.yml

permissions:
  contents: read

concurrency:
  group: codeprobe-phase4c-pyodide-measure
  cancel-in-progress: false

jobs:
  measure:
    if: ${{ github.actor == 'antonioclim' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the measurement commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true
          fetch-depth: 1
          lfs: false
          persist-credentials: false
          show-progress: false
          submodules: false

      - name: Measure the pinned Pyodide startup artefacts
        shell: bash
        run: |
          set -euo pipefail
          base='https://cdn.jsdelivr.net/pyodide/v0.25.0/full'
          release='https://github.com/pyodide/pyodide/releases/download/0.25.0/pyodide-core-0.25.0.tar.bz2'
          mkdir -p /tmp/codeprobe-pyodide
          for name in pyodide.js pyodide-lock.json python_stdlib.zip pyodide.asm.js pyodide.asm.wasm; do
            curl --fail --location --proto '=https' --tlsv1.2 \
              --retry 3 --retry-all-errors --connect-timeout 20 --max-time 180 \
              --output "/tmp/codeprobe-pyodide/$name" "$base/$name"
          done
          curl --fail --location --proto '=https' --tlsv1.2 \
            --retry 3 --retry-all-errors --connect-timeout 20 --max-time 300 \
            --output /tmp/codeprobe-pyodide/pyodide-core-0.25.0.tar.bz2 "$release"
          python -I -S -B - <<'PY'
          from __future__ import annotations
          import base64
          import hashlib
          import json
          import tarfile
          from pathlib import Path

          root = Path('/tmp/codeprobe-pyodide')
          names = (
              'pyodide.js',
              'pyodide-lock.json',
              'python_stdlib.zip',
              'pyodide.asm.js',
              'pyodide.asm.wasm',
              'pyodide-core-0.25.0.tar.bz2',
          )
          for name in names:
              payload = (root / name).read_bytes()
              digest = hashlib.sha256(payload).digest()
              print(
                  'ARTEFACT '
                  f'name={name} size={len(payload)} '
                  f'sha256={digest.hex()} '
                  f'sri=sha256-{base64.b64encode(digest).decode("ascii")}'
              )

          lock = json.loads((root / 'pyodide-lock.json').read_text(encoding='utf-8'))
          print(f'LOCK top_level={sorted(lock)}')
          info = lock.get('info') or {}
          print(f'LOCK info={json.dumps(info, sort_keys=True, separators=(",", ":"))}')
          packages = lock.get('packages') or {}
          print(f'LOCK packages={len(packages)}')

          required = {
              'pyodide.js',
              'pyodide-lock.json',
              'python_stdlib.zip',
              'pyodide.asm.js',
              'pyodide.asm.wasm',
          }
          with tarfile.open(root / 'pyodide-core-0.25.0.tar.bz2', 'r:bz2') as archive:
              members = [member for member in archive.getmembers() if member.isfile()]
              by_name = {Path(member.name).name: member for member in members}
              print(f'CORE regular_files={len(members)}')
              missing = sorted(required - set(by_name))
              print(f'CORE missing_required={missing}')
              for name in sorted(required & set(by_name)):
                  handle = archive.extractfile(by_name[name])
                  if handle is None:
                      raise SystemExit(f'cannot extract {name}')
                  payload = handle.read()
                  digest = hashlib.sha256(payload).hexdigest()
                  cdn_digest = hashlib.sha256((root / name).read_bytes()).hexdigest()
                  print(
                      'CORE_COMPARE '
                      f'name={name} size={len(payload)} sha256={digest} '
                      f'cdn_equal={digest == cdn_digest}'
                  )
          PY
