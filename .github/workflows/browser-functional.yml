name: Browser functional integrity

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - audit/codeprobe-hostile-remediation
    tags:
      - "v*"
  workflow_dispatch:

permissions: {}

concurrency:
  group: browser-functional-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUTF8: "1"
  PYTHONHASHSEED: "31412"

jobs:
  browser_functional:
    name: Browser functional integrity (Chromium)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true
          fetch-depth: 1
          lfs: false
          persist-credentials: false
          show-progress: false
          submodules: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          architecture: x64
          check-latest: false
          python-version: "3.14.7"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          architecture: x64
          check-latest: false
          node-version: "24.20.0"
          package-manager-cache: false

      - name: Prepare authenticated Pyodide core fixture
        shell: bash
        run: |
          set -euo pipefail
          python -I -S -B tools/prepare_pyodide_fixture.py \
            --output-dir "$RUNNER_TEMP/pyodide-v0.25.0-core"

      - name: Analyse a file and project through the verified runtime
        shell: bash
        env:
          CODEPROBE_PYODIDE_FIXTURE_DIR: ${{ runner.temp }}/pyodide-v0.25.0-core
        run: node tools/check_browser_functional.js

      - name: Confirm a clean checkout
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          dirty="$(git status --porcelain=v1 --untracked-files=all)"
          if [[ -n "$dirty" ]]; then
            printf '%s\n' "$dirty"
            exit 1
          fi
